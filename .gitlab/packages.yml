# The packaging lane on gitlab.com: deb, Ubuntu deb, rpm (with the COPR and
# openSUSE canaries), AppImage, snap and, on amd64 only, the Flatpak bundle and
# the Windows cross-build, plus the macOS arm64 bundle on a hosted Mac, each
# built natively and validated by the release lane's own packaging-ci scripts.
# Included by remote-build.yml and present only with PACKAGE_LANE=1.
# PACKAGE_ARCH (all|amd64|arm64) and PACKAGE_FORMATS (all, or a comma list of
# deb,rpm,appimage,snap,flatpak,windows,macos; snap needs appimage) narrow a
# rerun. macOS is built only in a release, with BUILD_MACOS_PACKAGES=true, or
# when PACKAGE_FORMATS names it. It publishes nothing: packages leave as job
# artifacts. Keep the package lists in step with .gitlab-ci.yml.

variables:
  PACKAGE_ARCH: "all"
  PACKAGE_FORMATS: "all"
  BUILD_MACOS_PACKAGES: "false"
  LIGHTNING_REPOSITORY: "https://gitlab.smetonis.net/Mizerd/lightning.git"
  SOURCE_REF: $CI_COMMIT_SHA
  # A shared runner's clone of this repository fails transiently and GitLab
  # reports it as a script failure, so a retry rule cannot tell it apart.
  GET_SOURCES_ATTEMPTS: "3"

# Not interruptible: a later pipeline on the same ref must never cancel a
# release build through auto-cancel.
.pkg-job:
  variables:
    # The source is this mirror's own checkout; SOURCE_REF must name it.
    LIGHTNING_SOURCE_FROM_CHECKOUT: "true"
    DEBIAN_FRONTEND: "noninteractive"
    BUILD_TYPE: "Release"
    PUBLISH_PACKAGES: "false"
  needs:
    - job: resolve-source
      artifacts: true

.pkg-build:
  extends: .pkg-job
  stage: build
  timeout: 3h
  variables:
    RUST_TOOLCHAIN: "1.93.0"
    RUSTUP_VERSION: "1.29.1"
  # configure-build.sh keeps cargo, its target dir and ccache under /cache.
  cache:
    key: pkg-$CI_JOB_NAME
    paths: [.ci-pkgcache/]
    when: always
  after_script:
    - if [ -d /cache/ccache ]; then CCACHE_DIR=/cache/ccache ccache --show-stats || true; fi
  artifacts:
    name: "lightning-$CI_JOB_NAME-$CI_PIPELINE_ID"
    when: always
    expire_in: 7 days
    paths: [dist/]

.pkg-validate:
  extends: .pkg-job
  stage: test
  timeout: 1h
  artifacts:
    when: always
    expire_in: 7 days
    paths: [dist/]

# An official (PUBLISH_PACKAGES=true) build does not link the restored cache
# in as /cache, so it compiles cold. -T: an existing /cache fails the job
# rather than nesting the link inside it.
.pkg-cache-dir: &pkg-cache-dir
  - >-
    if [ "$PUBLISH_PACKAGES" != true ]; then
    mkdir -p .ci-pkgcache && ln -sfnT "$CI_PROJECT_DIR/.ci-pkgcache" /cache; fi

# RUSTUP_TRIPLE and RUSTUP_INIT_SHA256 come from the job's architecture.
.pkg-rustup: &pkg-rustup
  - >-
    curl --fail --show-error --silent --location --max-redirs 3
    --proto '=https' --tlsv1.2
    "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${RUSTUP_TRIPLE}/rustup-init"
    --output /tmp/rustup-init
  - printf '%s  /tmp/rustup-init\n' "$RUSTUP_INIT_SHA256" | sha256sum -c -
  - chmod +x /tmp/rustup-init
  - /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
  - export PATH="/root/.cargo/bin:$PATH"

.pkg-deb-build-deps: &pkg-deb-build-deps
  - apt-get update
  - >-
    apt-get install -y --no-install-recommends
    build-essential ca-certificates ccache cmake curl debhelper dpkg-dev
    fakeroot file git jq libsecret-1-dev libsqlite3-dev libssl-dev
    ninja-build patchelf pkg-config qt6-base-dev qt6-base-private-dev qt6-declarative-dev
    qt6-multimedia-dev qt6-svg-dev qt6-tools-dev zstd
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    libgstreamer-plugins-bad1.0-dev

.pkg-rpm-build-deps: &pkg-rpm-build-deps
  - >-
    dnf install -y
    appstream ca-certificates ccache cmake curl desktop-file-utils
    gcc gcc-c++ git jq libsecret-devel
    ninja-build openssl-devel patchelf pkgconf-pkg-config
    qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel
    qt6-qtsvg-devel qt6-qttools-devel rpm-build sqlite-devel zstd
    gstreamer1-devel gstreamer1-plugins-base-devel
    gstreamer1-plugins-bad-free-devel

.pkg-appimage-build-deps: &pkg-appimage-build-deps
  - apt-get update
  - >-
    apt-get install -y --no-install-recommends
    build-essential ca-certificates ccache cmake curl file git jq
    libsecret-1-dev libsqlite3-dev libssl-dev ninja-build patchelf
    pkg-config qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-multimedia-dev qt6-svg-dev
    qt6-svg-plugins qt6-tools-dev qt6-wayland qml6-module-qtmultimedia
    qml6-module-qtquick qml6-module-qtquick-controls
    qml6-module-qtquick-dialogs qml6-module-qtquick-effects
    qml6-module-qtquick-layouts qml6-module-qtquick-window zstd
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    libgstreamer-plugins-bad1.0-dev
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good
    gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-pipewire
    gstreamer1.0-alsa gstreamer1.0-gl
    libnss3 libspa-0.2-modules libpipewire-0.3-modules
    qt6-image-formats-plugins libjxl0.11
    qt6-xdgdesktopportal-platformtheme
    libhunspell-1.7-0 hunspell-en-us hunspell-en-gb hunspell-ar hunspell-bn
    hunspell-de-de hunspell-es hunspell-fr-classical hunspell-hi hunspell-id
    hunspell-lt hunspell-pt-pt hunspell-pt-br hunspell-ru
  - >-
    ( cd /tmp && apt-get download pipewire-bin
    && dpkg-deb -x pipewire-bin_*.deb /opt/pipewire-conf )
  - test -f /opt/pipewire-conf/usr/share/pipewire/client.conf
  - >-
    ( cd /tmp && apt-get download kimageformat6-plugins
    && dpkg-deb -x kimageformat6-plugins_*.deb /opt/kimageformats )
  - test -f "/opt/kimageformats/usr/lib/$(gcc -print-multiarch)/qt6/plugins/imageformats/kimg_jxl.so"

.pkg-snap-build-deps: &pkg-snap-build-deps
  - apt-get update
  - >-
    apt-get install -y --no-install-recommends
    ca-certificates file jq python3 python3-yaml squashfs-tools zstd
    libegl1 libglx0 libgl1 libopengl0
    libx11-6 libx11-xcb1 libxcb1 libxkbcommon-x11-0
    libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
    libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1
    libxcb-xfixes0 libxcb-xkb1 libxcb-cursor0 libxcb-util1
    libxcb-glx0 libxcb-present0 libxcb-dri3-0
    binutils libsm6 libice6 libuuid1
    libasound2t64 libdrm2 libgbm1
    libwayland-cursor0 libwayland-egl1
    libfribidi0 libthai0
    xkb-data fontconfig-config shared-mime-info

.pkg-clean-validator: &pkg-clean-validator
  - test ! -e work/lightning
  - command -v nix >/dev/null 2>&1 && exit 1 || true

.pkg-deb-validate-deps: &pkg-deb-validate-deps
  - *pkg-clean-validator
  - apt-get update
  - >-
    apt-get install -y --no-install-recommends
    appstream binutils ca-certificates desktop-file-utils file lintian
    procps shared-mime-info

# No Qt: the bundle must be self-contained apart from the AppImage base-system
# excludelist, which is what this list provides.
.pkg-appimage-validate-deps: &pkg-appimage-validate-deps
  - *pkg-clean-validator
  - apt-get update
  - >-
    apt-get install -y --no-install-recommends
    binutils ca-certificates desktop-file-utils file libasound2t64 libcom-err2 libegl1 libfontconfig1
    libfreetype6 libgl1 libglib2.0-0 libgpg-error0 libharfbuzz0b
    libopengl0 libwayland-client0 libwayland-cursor0 libwayland-egl1
    libx11-6 libxcb1 libxdamage1 libxext6 libxfixes3
    libxkbcommon0 libxtst6 python3 zstd

.pkg-snap-validate-deps: &pkg-snap-validate-deps
  - *pkg-clean-validator
  - apt-get update
  - >-
    apt-get install -y --no-install-recommends
    binutils ca-certificates file libasound2t64 libcom-err2 libegl1 libfontconfig1
    libfreetype6 libgl1 libglib2.0-0 libgpg-error0 libharfbuzz0b
    libopengl0 libwayland-client0 libwayland-cursor0 libwayland-egl1
    libx11-6 libxcb1 libxdamage1 libxext6 libxfixes3
    libxkbcommon0 libxtst6
    python3 python3-yaml squashfs-tools zstd

.pkg-opensuse-validate-deps: &pkg-opensuse-validate-deps
  - *pkg-clean-validator
  - zypper --non-interactive refresh
  - >-
    zypper --non-interactive install --no-recommends
    AppStream binutils ca-certificates cpio desktop-file-utils file procps

resolve-source:
  extends: .pkg-job
  stage: .pre
  rules:
    - if: '$PACKAGE_LANE == "1"'
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [saas-linux-small-amd64]
  timeout: 15m
  needs: []
  before_script:
    - apt-get update
    # openssl: validate-release-request.sh checks the update-signing public key.
    - apt-get install -y --no-install-recommends ca-certificates git jq openssl
  script:
    # The update-signing private key never reaches gitlab.com.
    - test -z "${UPDATE_SIGNING_KEY_B64:-}"
    # A release run needs the same inputs, keys and default branch as at home.
    - ./packaging-ci/scripts/validate-release-request.sh
    - ./packaging-ci/scripts/fetch-lightning-source.sh
    - ./packaging-ci/scripts/resolve-version.sh
    - ./packaging-ci/scripts/write-resolved-env.sh
  artifacts:
    expire_in: 7 days
    paths:
      - dist/source-info.json
      - dist/version.env
      - dist/version.json
    reports:
      dotenv: dist/resolved.env

