# CI file for the gitlab.com mirror only (set as its ci_config_path).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"

# PACKAGE_LANE=1 runs the package lane instead of the dev build.
include:
  - local: .gitlab/packages.yml

build-nixos:
  image: nixos/nix:latest
  tags: [saas-linux-2xlarge-amd64]
  timeout: 2h 50m
  rules:
    - if: $PACKAGE_LANE == "1"
      when: never
    - when: on_success
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
    CARGO_PROFILE_RELEASE_LTO: thin
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  cache:
    key: remote-build
    paths: [.ci-cargo/]
    unprotect: true
  script:
    - export CARGO_HOME=$PWD/.ci-cargo
    - nix develop -c cargo fetch --locked --manifest-path rust/Cargo.toml
    - nix develop -c cmake -S . -B build-remote -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_RUST_SDK_BACKEND=ON -DBUILD_TESTING=OFF
    - nix develop -c cmake --build build-remote --target lightning-matrix -j32
    - strip build-remote/lightning-matrix || nix develop -c strip build-remote/lightning-matrix
    - mkdir -p out && cp build-remote/lightning-matrix out/
    - nix flake metadata --json | sha256sum > out/flake.sha256
  artifacts:
    paths: [out/]
    expire_in: 1 week

test-nixos:
  image: nixos/nix:latest
  tags: [saas-linux-2xlarge-amd64]
  timeout: 2h 50m
  rules:
    - if: $RUN_TESTS == "1"
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
    CARGO_PROFILE_RELEASE_LTO: thin
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    CCACHE_DIR: $CI_PROJECT_DIR/.ci-ccache
    CCACHE_BASEDIR: $CI_PROJECT_DIR
    CCACHE_NOHASHDIR: "true"
    CCACHE_MAXSIZE: 4G
    SCCACHE_DIR: $CI_PROJECT_DIR/.ci-sccache
    SCCACHE_CACHE_SIZE: 4G
    CARGO_INCREMENTAL: "0"
  cache:
    - key: remote-build
      paths: [.ci-cargo/]
      policy: pull
      unprotect: true
    - key: test-ccache
      paths: [.ci-ccache/, .ci-sccache/]
      when: always
      unprotect: true
  script:
    - export CARGO_HOME=$PWD/.ci-cargo
    - export RUSTC_WRAPPER=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#sccache)/bin/sccache
    - nix develop -c cargo fetch --locked --manifest-path rust/Cargo.toml
    - nix develop -c cmake -S . -B build-test -G Ninja -DENABLE_RUST_SDK_BACKEND=ON -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_FLAGS=-g0 "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--strip-debug" -DCMAKE_JOB_POOLS=lk=12 -DCMAKE_JOB_POOL_LINK=lk
    - nix develop -c ccache -z
    - nix develop -c cmake --build build-test -j32
    - nix develop -c ccache -s
    - $RUSTC_WRAPPER --show-stats | grep -E 'Cache hits|Cache misses|Non-cacheable' || true
    - mkdir -p out
    - export QT_QPA_PLATFORM=offscreen HOME=$PWD/.ci-home XDG_RUNTIME_DIR=$PWD/.ci-run; mkdir -p $HOME $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
    - mkdir -p $PWD/.ci-fonts
    - |
      cat > $PWD/.ci-fonts/fonts.conf <<CONF
      <?xml version="1.0"?>
      <fontconfig>
      <dir>$PWD/data/fonts</dir>
      <cachedir>$PWD/.ci-fonts/cache</cachedir>
      <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
      <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
      </fontconfig>
      CONF
    - export FONTCONFIG_FILE=$PWD/.ci-fonts/fonts.conf
    - mkdir -p /etc/dbus-1 /var/lib/dbus
    - |
      cat > /etc/dbus-1/session.conf <<'CONF'
      <busconfig><type>session</type><listen>unix:tmpdir=/tmp</listen>
      <policy context="default"><allow send_destination="*" eavesdrop="true"/><allow eavesdrop="true"/><allow own="*"/></policy>
      </busconfig>
      CONF
    - nix develop -c dbus-uuidgen --ensure=/etc/machine-id
    - nix develop -c dbus-run-session -- ctest --test-dir build-test -j8 --timeout 1500 --repeat until-pass:2 --output-junit $PWD/out/ctest.xml --output-on-failure 2>&1 | tee out/ctest.log | tail -40 || true
    - grep -q '100% tests passed' out/ctest.log
  artifacts:
    when: always
    paths: [out/]
    expire_in: 1 week

test-rust:
  image: nixos/nix:latest
  tags: [saas-linux-2xlarge-amd64]
  timeout: 1h
  rules:
    - if: $RUN_TESTS == "1"
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
  cache:
    key: remote-build
    paths: [.ci-cargo/]
    policy: pull
    unprotect: true
  script:
    - export CARGO_HOME=$PWD/.ci-cargo
    - mkdir -p out
    - nix develop -c cargo fetch --locked --manifest-path rust/Cargo.toml
    - nix develop -c cargo test --manifest-path rust/Cargo.toml -j32 2>&1 | tee out/cargo.log | grep -E '^test result|FAILED|panicked' | head -20 || true
    - "! grep -q 'test result: FAILED' out/cargo.log"
    - grep -q 'passed;' out/cargo.log
  artifacts:
    when: always
    paths: [out/]
    expire_in: 1 week
