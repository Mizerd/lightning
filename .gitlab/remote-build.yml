# CI file for the gitlab.com mirror only (set as its ci_config_path).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"

build-nixos:
  image: nixos/nix:latest
  tags: [saas-linux-2xlarge-amd64]
  timeout: 2h 50m
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
    CARGO_PROFILE_RELEASE_LTO: thin
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  cache:
    key: remote-build
    paths: [.ci-cargo/]
  script:
    - export CARGO_HOME=$PWD/.ci-cargo
    - nix develop -c cargo fetch --locked --manifest-path rust/Cargo.toml
    - nix develop -c cmake -S . -B build-remote -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_RUST_SDK_BACKEND=ON -DBUILD_TESTING=OFF
    - nix develop -c cmake --build build-remote --target lightning-matrix -j32
    - strip build-remote/lightning-matrix || nix develop -c strip build-remote/lightning-matrix
    - mkdir -p out && cp build-remote/lightning-matrix out/
    - nix flake metadata --json | sha256sum > out/flake.sha256
  artifacts:
    paths: [out/]
    expire_in: 1 week

test-nixos:
  image: nixos/nix:latest
  tags: [saas-linux-2xlarge-amd64]
  timeout: 2h 50m
  rules:
    - if: $RUN_TESTS == "1"
  variables:
    NIX_CONFIG: "experimental-features = nix-command flakes"
    CARGO_PROFILE_RELEASE_LTO: thin
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  script:
    - export CARGO_HOME=$PWD/.ci-cargo
    - nix develop -c cargo fetch --locked --manifest-path rust/Cargo.toml
    - nix develop -c cmake -S . -B build-test -G Ninja -DENABLE_RUST_SDK_BACKEND=ON -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_FLAGS=-g0 "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--strip-debug" -DCMAKE_JOB_POOLS=lk=12 -DCMAKE_JOB_POOL_LINK=lk
    - nix develop -c cmake --build build-test -j32
    - mkdir -p out
    - export QT_QPA_PLATFORM=offscreen HOME=$PWD/.ci-home XDG_RUNTIME_DIR=$PWD/.ci-run; mkdir -p $HOME $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
    - mkdir -p /etc/dbus-1 /var/lib/dbus
    - |
      cat > /etc/dbus-1/session.conf <<'CONF'
      <busconfig><type>session</type><listen>unix:tmpdir=/tmp</listen>
      <policy context="default"><allow send_destination="*" eavesdrop="true"/><allow eavesdrop="true"/><allow own="*"/></policy>
      </busconfig>
      CONF
    - nix develop -c dbus-uuidgen --ensure=/etc/machine-id
    - nix develop -c dbus-run-session -- ctest --test-dir build-test -j16 --timeout 1500 --output-junit $PWD/out/ctest.xml --output-on-failure 2>&1 | tee out/ctest.log | tail -40
    - grep -q '100% tests passed' out/ctest.log
    - nix develop -c cargo test --manifest-path rust/Cargo.toml -j32 2>&1 | tee out/cargo.log | grep -E '^test result|FAILED|panicked' | head -20
  artifacts:
    when: always
    paths: [out/]
    expire_in: 1 week
