name: lightning-windows-cross-runner

services:
  runner:
    image: gitlab/gitlab-runner:v19.2.0
    container_name: lightning-windows-cross-runner
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config:/etc/gitlab-runner
      - ./cache:/cache
      - ./home:/home/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "gitlab-runner", "verify"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 20s
