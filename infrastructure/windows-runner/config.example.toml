concurrent = 1
check_interval = 3
shutdown_timeout = 30

[[runners]]
  name = "lightning-windows-cross-main-gitlab"
  url = "https://gitlab.smetonis.net"
  token = "REPLACE_ON_HOST_WITH_PROJECT_RUNNER_AUTHENTICATION_TOKEN"
  executor = "docker"
  limit = 1
  request_concurrency = 2

  [runners.docker]
    image = "lightning-windows-builder:fedora44-qt6.11.1-rust1.95.0-v1"
    privileged = false
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    pull_policy = "if-not-present"
    allowed_pull_policies = ["if-not-present"]
    allowed_images = ["lightning-windows-builder:fedora44-qt6.11.1-rust1.95.0-v1"]
    volumes = ["/srv/gitlab-runners/lightning-windows/cache:/cache:rw"]
    shm_size = 268435456
    cpus = "4"
    memory = "8g"
    memory_swap = "10g"
    pids_limit = 2048
