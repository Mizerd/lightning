concurrent = 1
check_interval = 3
shutdown_timeout = 30

[[runners]]
  name = "lightning-windows-cross-main-gitlab"
  # Keep coordinator polling and large job-artifact uploads on the host-internal
  # GitLab endpoint. Source repositories still use the canonical HTTPS URL.
  url = "http://10.195.35.2"
  token = "REPLACE_ON_HOST_WITH_PROJECT_RUNNER_AUTHENTICATION_TOKEN"
  executor = "docker"
  limit = 1
  request_concurrency = 2

  [runners.docker]
    image = "lightning-windows-builder:fedora44-qt6.11.1-ffmpeg7.1.1-gst1.28.5-rust1.95.0-v3"
    privileged = false
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    pull_policy = "if-not-present"
    allowed_pull_policies = ["if-not-present"]
    # The image is pinned by exact tag and never pulled, so a builder change is a
    # new tag plus an edit here. Keep the PREVIOUS tag in the allowlist as well:
    # rolling back is then an `image =` edit and a restart, with no window in
    # which the runner is allowed to run nothing.
    allowed_images = [
      "lightning-windows-builder:fedora44-qt6.11.1-ffmpeg7.1.1-rust1.95.0-v2",
      "lightning-windows-builder:fedora44-qt6.11.1-ffmpeg7.1.1-gst1.28.5-rust1.95.0-v3",
    ]
    volumes = ["/srv/gitlab-runners/lightning-windows/cache:/cache:rw"]
    shm_size = 268435456
    cpus = "4"
    memory = "8g"
    memory_swap = "10g"
    pids_limit = 2048
