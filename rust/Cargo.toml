[package]
name = "matrix-client-rust"
version = "0.9.9"
edition = "2021"
description = "FFI bridge to the Matrix Rust SDK for the C++/Qt Lightning matrix client"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "matrix_client_rust"
# staticlib: linked into the C++ executable, producing a single binary.
crate-type = ["staticlib"]

[dependencies]
# testing: matrix-sdk 0.18 gates the only public OlmMachine accessor
#   (`Client::olm_machine_for_testing`) behind it, and the E2EE recovery
#   coordinator needs `OlmMachine::query_missing_secrets_from_other_sessions`
#   to re-issue m.secret.request. Every `testing`-gated site in
#   matrix-sdk/-base 0.18.0 was audited as additive only.
# experimental-send-custom-to-device: gates
#   `Encryption::encrypt_and_send_raw_to_device`, the only way to send
#   MatrixRTC media keys (io.element.call.encryption_keys) Olm-encrypted per
#   device in 0.18.
# qrcode: SDK QR verification (QrVerification, generate_qr_code,
#   QrCodeShowV1/ReciprocateV1).
# bundled-sqlite: the local message index needs FTS5, a compile-time SQLite
#   option. The bundled amalgamation enables it (libsqlite3-sys build.rs), so
#   search works on every platform instead of depending on the host's
#   libsqlite3. The SDK stores share it; the file format is unchanged.
matrix-sdk = { version = "0.18", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite", "markdown", "testing", "qrcode", "experimental-send-custom-to-device"] }
# The SDK Timeline (VectorDiff subscription, retry decryption, pagination,
# local echoes) used by the timeline registry.
matrix-sdk-ui = { version = "=0.18.0", default-features = false }
# Direct dependency for UtdCause; same version matrix-sdk already pulls in.
matrix-sdk-base = { version = "=0.18.0", default-features = false, features = ["e2e-encryption"] }
futures-util = { version = "0.3", default-features = false }
# gzip/deflate: without them reqwest sends no Accept-Encoding and cannot
# decode compressed responses, which breaks some link previews (CDN/WAF
# layers treat such requests as non-browser). brotli is not in the vendored
# offline dependency set.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "gzip", "deflate"] }
url = "2"
# The local message index. Already in Cargo.lock via matrix-sdk-sqlite.
rusqlite = { version = "0.37", default-features = false }
base64 = "0.22"
html5ever = "0.39.0"
tendril = "0.5"
# MIME values for SDK attachment sending; the version matrix-sdk already uses.
mime = "0.3"
once_cell = "1"
# MSC4143 rtc member identity is unpadded-base64(sha256(canonical JSON)).
# Already pinned transitively by matrix-sdk.
sha2 = "=0.10.9"
# LiveKit SFU signalling: protocol types and a WebSocket only, no media stack
# (media stays on the GStreamer engine). The full `livekit` crate pulls
# webrtc-sys, which downloads libwebrtc at build time and breaks
# --offline --locked.
livekit-protocol = "0.7"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
prost = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
# Source for the committed emoji catalogue (generate_emoji_catalog); already
# pinned transitively by matrix-sdk-ui 0.18.0.
emojis = "=0.8.2"
# Opt-in forwarding of matrix-sdk's `tracing` diagnostics (to-device
# decryption, Olm sessions, key gossip); see `install_sdk_tracing` in lib.rs.
# Same version already in the lock file.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
# ruma's `EventContent` derive checks `cfg(ruma_unstable_exhaustive_types)`,
# which only ruma's build defines; declared so the custom MatrixRTC event
# contents in rtc.rs do not warn.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(ruma_unstable_exhaustive_types)',
] }

# Panics unwind (the default); do not set `panic = "abort"`. matrix-sdk
# contains panics in its own tasks with catch_unwind, and every FFI entry
# point here does the same (the `ffi_*` helpers), so no panic crosses the C
# boundary. Abort would turn any SDK panic into a crash of the whole app.

# Keep dev debug info in split files: every test binary links the debug
# staticlib, and packed DWARF was copied into each one (tens of GB across
# the test trees). Debuggers follow the split files. Release is unaffected.
[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
