[package]
name = "matrix-client-rust"
version = "0.5.0"
edition = "2021"
description = "FFI bridge to the Matrix Rust SDK for the C++/Qt Lightning matrix client"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "matrix_client_rust"
# staticlib: linked into the C++ executable so we produce a single binary.
# cdylib would require runtime loader plumbing we do not need here.
crate-type = ["staticlib"]

# v0.5.0-prep: no matrix-sdk dependency yet. The bridge exposes just
# enough for the C++ side to prove it can link against Rust and call in.
#
# Wiring the real matrix-sdk crate is the next follow-up prompt (see
# docs/next-prompts.md). That step requires explicit user authorization
# for the ~500 transitive dependencies matrix-sdk pulls from crates.io,
# and is a materially bigger build (~15 min from scratch), so it lives
# in its own gated pass rather than sneaking in here.
[dependencies]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
