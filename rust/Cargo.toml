[package]
name = "matrix-client-rust"
version = "0.5.0"
edition = "2021"
description = "FFI bridge to the Matrix Rust SDK for the C++/Qt Lightning matrix client"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "matrix_client_rust"
# staticlib: linked into the C++ executable so we produce a single binary.
# cdylib would require runtime loader plumbing we do not need here.
crate-type = ["staticlib"]

# v0.5.0-prep: no matrix-sdk dependency yet. See docs/next-prompts.md for
# the wiring recipe. Adding the crate is blocked at the environment level
# by the untrusted-code-integration classifier — the user needs to add a
# project-scoped Bash permission rule for `nix develop -c cargo *` inside
# `rust/` before the next attempt.
[dependencies]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
