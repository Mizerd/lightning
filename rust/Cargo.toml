[package]
name = "matrix-client-rust"
version = "0.5.6"
edition = "2021"
description = "FFI bridge to the Matrix Rust SDK for the C++/Qt Lightning matrix client"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "matrix_client_rust"
# staticlib: linked into the C++ executable so we produce a single binary.
# cdylib would require runtime loader plumbing we do not need here.
crate-type = ["staticlib"]

[dependencies]
matrix-sdk = { version = "0.18", default-features = false, features = ["e2e-encryption", "sqlite"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
