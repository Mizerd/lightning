stages:
  - resolve
  - build
  - validate
  - publish
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

variables:
  LIGHTNING_REPOSITORY:
    value: "https://gitlab.smetonis.net/Mizerd/lightning.git"
    description: "Canonical Lightning source repository (project 6)."
  SOURCE_REF:
    value: "main"
    description: "Lightning vX.Y.Z tag, branch, or full commit SHA to build. Publication requires vX.Y.Z."
  PUBLISH_PACKAGES:
    value: "false"
    options: ["false", "true"]
    description: "Upload both validated packages to project 6 and link its existing release."
  BUILD_TYPE: "Release"
  BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CARGO_BUILD_JOBS: "2"
  LIGHTNING_PROJECT_ID: "6"
  PACKAGE_NAME: "lightning"

.trusted-pipeline:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'

.build-base:
  extends: .trusted-pipeline
  stage: build
  interruptible: true
  timeout: 2h
  needs:
    - job: resolve-source
      artifacts: true
  artifacts:
    name: "lightning-${FORMAT}-${CI_PIPELINE_ID}"
    when: always
    expire_in: 7 days
    paths: [dist/]

resolve-source:
  extends: .trusted-pipeline
  stage: resolve
  image: debian:13.6-slim
  tags: [apt, deb, package]
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git jq
  script:
    - ./scripts/fetch-lightning-source.sh
    - ./scripts/resolve-version.sh
    - ./scripts/write-resolved-env.sh
  artifacts:
    expire_in: 7 days
    paths: [dist/source-info.json, dist/version.env, dist/version.json]
    reports:
      dotenv: dist/resolved.env

build-deb:
  extends: .build-base
  image: debian:13.6-slim
  tags: [apt, deb, package]
  variables:
    FORMAT: "deb"
    BASE_IMAGE: "debian:13.6-slim"
    DEBIAN_FRONTEND: "noninteractive"
    RUST_TOOLCHAIN: "1.93.0"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential ca-certificates cmake curl debhelper dpkg-dev fakeroot
      file git jq libsecret-1-dev libsqlite3-dev libssl-dev ninja-build
      patchelf pkg-config qt6-base-dev qt6-declarative-dev qt6-tools-dev zstd
    - >-
      curl --fail --show-error --silent --location
      --proto '=https' --tlsv1.2 https://sh.rustup.rs
      --output /tmp/rustup-init.sh
    - sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./scripts/prepare-pinned-source.sh
    - ./scripts/build-deb.sh
    - ./scripts/write-build-info.sh deb

build-rpm:
  extends: .build-base
  image: fedora:44
  tags: [dnf, rpm, package]
  variables:
    FORMAT: "rpm"
    BASE_IMAGE: "fedora:44"
  before_script:
    - >-
      dnf install -y
      cargo ca-certificates cmake curl gcc gcc-c++ git jq libsecret-devel
      ninja-build openssl-devel patchelf pkgconf-pkg-config
      qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel
      qt6-qttools-devel rpm-build rust sqlite-devel zstd
  script:
    - ./scripts/prepare-pinned-source.sh
    - ./scripts/build-rpm.sh
    - ./scripts/write-build-info.sh rpm

validate-deb:
  extends: .trusted-pipeline
  stage: validate
  image: debian:13.6-slim
  tags: [apt, deb, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-deb
      artifacts: true
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      appstream binutils ca-certificates desktop-file-utils file lintian
      procps shared-mime-info
  script: [./scripts/validate-deb.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.deb
      - dist/*.sha256
      - dist/*deb*.log
      - dist/*deb*.txt
      - dist/source-info.json
      - dist/version.json

validate-rpm:
  extends: .trusted-pipeline
  stage: validate
  image: fedora:44
  tags: [dnf, rpm, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-rpm
      artifacts: true
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - dnf install -y appstream binutils cpio desktop-file-utils file procps-ng rpmlint
  script: [./scripts/validate-rpm.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.rpm
      - dist/*.sha256
      - dist/*rpm*.log
      - dist/*rpm*.txt
      - dist/source-info.json
      - dist/version.json

publish-packages:
  stage: publish
  image: alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: validate-deb
      artifacts: true
    - job: validate-rpm
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_PACKAGES == "true" && $SOURCE_REF =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - when: never
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./scripts/publish-packages.sh]
  artifacts:
    expire_in: 1 day
    paths: [dist/publication.json]

attach-release-assets:
  stage: release
  image: alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-packages
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_PACKAGES == "true" && $SOURCE_REF =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - when: never
  before_script: [apk add --no-cache bash curl jq]
  script: [./scripts/attach-release-assets.sh]
