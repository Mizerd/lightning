    - apt-get install -y --no-install-recommends ca-certificates flatpak
  script: [./packaging-ci/scripts/validate-flatpak.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.flatpak
      - dist/*.sha256
      - dist/*flatpak*.log
      - dist/*flatpak*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

validate-appimage:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [appimage, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-appimage
      artifacts: true
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    # No Qt here: the bundle must be self-contained apart from the AppImage
    # base-system excludelist, which is what this list provides.
    # libwayland-* are host-provided (issue #9: a bundled copy older than the
    # host's crashed Mesa EGL on Wayland) and libgstopengl links them.
    # libxdamage1/libxfixes3/libxtst6 are for libgstximagesrc, the X11 share
    # fallback, whose X libraries the excludelist leaves to the host.
    - >-
      apt-get install -y --no-install-recommends
      binutils ca-certificates desktop-file-utils file libasound2t64 libcom-err2 libegl1 libfontconfig1
      libfreetype6 libgl1 libglib2.0-0 libgpg-error0 libharfbuzz0b
      libopengl0 libwayland-client0 libwayland-cursor0 libwayland-egl1
      libx11-6 libxcb1 libxdamage1 libxext6 libxfixes3
      libxkbcommon0 libxtst6 zstd
  script: [./packaging-ci/scripts/validate-appimage.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.AppImage
      - dist/*.sha256
      - dist/*appimage*.log
      - dist/*appimage*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

validate-snap:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)snap(,|$)/ && $BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517 # ubuntu:24.04
  tags: [snap, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-snap
      artifacts: true
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    # Base-system libs only, as for the AppImage; the snap payload bundles Qt.
    # No snapd exists in this fleet; see validate-snap.sh. The libwayland-* and
    # X11 libraries are here for the same reasons as in validate-appimage.
    - >-
      apt-get install -y --no-install-recommends
      binutils ca-certificates file libasound2t64 libcom-err2 libegl1 libfontconfig1
      libfreetype6 libgl1 libglib2.0-0 libgpg-error0 libharfbuzz0b
      libopengl0 libwayland-client0 libwayland-cursor0 libwayland-egl1
      libx11-6 libxcb1 libxdamage1 libxext6 libxfixes3
      libxkbcommon0 libxtst6
      python3 python3-yaml squashfs-tools zstd
  script: [./packaging-ci/scripts/validate-snap.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.snap
      - dist/*.sha256
      - dist/*snap*.log
      - dist/*snap*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

publish-packages:
  extends: .publish-rules
  stage: publish
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    # Never write the immutable registry with a mirror we cannot fill.
    - job: github-mirror-preflight
      artifacts: false
    - job: resolve-source
      artifacts: true
    - job: validate-deb
      artifacts: true
    # The Ubuntu deb is published but not in the signed update manifest; see
    # write-manifest.sh.
    - job: validate-deb-ubuntu
      artifacts: true
    - job: validate-rpm
      artifacts: true
    # A gate only: the same .rpm, installed and run on openSUSE Tumbleweed.
    - job: validate-rpm-opensuse
      artifacts: false
    - job: validate-flatpak
      artifacts: true
    - job: validate-appimage
      artifacts: true
    - job: validate-snap
      artifacts: true
    - job: build-windows
      artifacts: true
    # Required, never optional: a release cannot publish without macOS
    # (2026-10-07). .macos-test-rules puts it in every publishing pipeline.
    - job: macos-package-test
      artifacts: true
    # Gates only: nothing of theirs is published, but a release may not pass
    # with any of them red (2026-10-07).
    - job: copr-srpm
      artifacts: false
    - job: build-rpm-opensuse
      artifacts: false
    - job: validate-rpm-leap
      artifacts: false
  before_script: [apk add --no-cache bash coreutils curl jq]
  script:
    # Set on the command line, where no trigger variable can override it:
    # write-manifest.sh refuses to publish without the macOS bundle.
    - LIGHTNING_REQUIRE_MACOS_ASSET=true ./packaging-ci/scripts/write-manifest.sh
    - ./packaging-ci/scripts/publish-packages.sh
  artifacts:
    expire_in: 7 days
    paths:
      - dist/manifest.json
      - dist/publication.json
      # A published release file; the GitHub mirror job needs its bytes.
      - dist/SHA256SUMS

verify-published-packages:
  extends: .publish-rules
  stage: verify
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-packages
      artifacts: true
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/verify-published-packages.sh]
  artifacts:
    expire_in: 7 days
    paths:
      - dist/manifest.json
      - dist/verification.json

# The update manifest is signed before the release is created and published
# after it (see docs/update-manifest.md):
#   * sign-update-manifest runs first, so a broken signing key fails before an
#     immutable tag exists.
#   * publish-update-manifest promotes `latest` only once the release page it
#     links to exists; a delayed promotion is harmless and retryable.
#
# Alpine lacks the openssl CLI, so these jobs install it.
sign-update-manifest:
  extends: .publish-rules
  stage: sign
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  # UPDATE_SIGNING_KEY_B64 is scoped to the `signing` environment so build jobs,
  # which run project-6 CMake and every crate's build.rs, can never read it.
  # UPDATE_SIGNING_KEY_ID and UPDATE_SIGNING_PUBKEY_<id> are public and stay
  # unscoped. Only resolve-source and this job declare `signing`, and neither
  # runs project-6 code.
  environment:
    name: signing
    action: prepare
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-packages
      artifacts: true
    - job: verify-published-packages
      artifacts: true
  before_script: [apk add --no-cache bash coreutils curl jq openssl]
  script:
    - ./packaging-ci/scripts/generate-update-manifest.sh
    - ./packaging-ci/scripts/sign-update-manifest.sh
  artifacts:
    expire_in: 30 days
    paths:
      - dist/update-manifest-v1.json
      - dist/update-manifest-v1.json.sig

finalize-release:
  extends: .publish-rules
  stage: release
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-packages
      artifacts: true
    - job: verify-published-packages
      artifacts: true
    # Ordering only: release only once the update manifest is proved signable.
    - job: sign-update-manifest
      artifacts: false
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/finalize-release.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/manifest.json
      - dist/verification.json

# GitHub bandwidth mirror (MIRROR-SPEC §6). GitLab stays the release authority;
# this uploads the published artifacts to a GitHub Release at the same tag and
# verifies each by anonymous re-download against dist/manifest.json.
#   * After finalize-release: the mirrored tag must exist and peel to the
#     released commit, so GitHub never creates a tag of its own.
#   * Before publish-update-manifest: every promoted mirror_url is proved first.
# A no-op when GITHUB_MIRROR_REPO is unset.
mirror-release-to-github:
  extends: .publish-rules
  stage: mirror
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  # The script is idempotent, so transient GitHub failures are retried.
  retry:
    max: 2
    when: [script_failure, runner_system_failure, stuck_or_timeout_failure, api_failure]
  # A manifest refresh (UPDATE_REFRESH_LATEST_ONLY=true) exits before touching
  # GitHub. GITHUB_MIRROR_TOKEN is scoped to the `mirror` environment to keep
  # it out of build jobs.
  environment:
    name: mirror
    action: prepare
  needs:
    - job: resolve-source
      artifacts: true
    - job: validate-deb
      artifacts: true
    # The Ubuntu deb is published but not in the signed update manifest; see
    # write-manifest.sh.
    - job: validate-deb-ubuntu
      artifacts: true
    - job: validate-rpm
      artifacts: true
    - job: validate-flatpak
      artifacts: true
    - job: validate-appimage
      artifacts: true
    - job: validate-snap
      artifacts: true
    - job: build-windows
      artifacts: true
    - job: publish-packages
      artifacts: true
    - job: verify-published-packages
      artifacts: true
    # Required as in publish-packages. This job needs every file the
    # publication manifest names, including the macOS zip.
    - job: macos-package-test
      artifacts: true
    # Its mirror_url values are cross-checked before anything is uploaded.
    - job: sign-update-manifest
      artifacts: true
    # Ordering only: the mirror never precedes the GitLab release.
    - job: finalize-release
      artifacts: false
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/mirror-release-to-github.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/manifest.json
      - dist/github-mirror.json

publish-update-manifest:
  extends: .publish-rules
  stage: update
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: verify-published-packages
      artifacts: true
    - job: sign-update-manifest
      artifacts: true
    # Ordering only: `latest` never advertises an unfinalized release.
    - job: finalize-release
      artifacts: false
    # Ordering only: every promoted mirror_url is already verified.
    - job: mirror-release-to-github
      artifacts: false
  before_script: [apk add --no-cache bash coreutils curl jq openssl]
  script: [./packaging-ci/scripts/publish-update-manifest.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/update-manifest-v1.json
      - dist/update-manifest-v1.json.sig
      - dist/update-publication.json

# Checks the published release itself, not job status, for the macOS asset.
# Since 2026-10-07 publish-packages cannot run without a green macOS job, so
# this is the after-the-fact proof that the bytes reached the release. It runs
# after finalize-release and is not allow_failure: a miss turns the pipeline
# red.
report-optional-assets:
  extends: .publish-rules
  stage: update
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  needs:
    - job: resolve-source
      artifacts: true
    - job: finalize-release
      artifacts: false
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/report-optional-assets.sh]

# Opens the Flathub update pull request: re-pins the root manifest to the new
# tag and commit and pushes it with cargo-sources.json to a branch of the
# Flathub repository, taken from the GitHub mirror at the tag (what Flathub
# fetches). Never merges: Flathub publishes only a merged PR and test-builds
# every PR, so the maintainer merges after that build. NOT allow_failure
# (2026-10-07): it runs after the tag so it cannot block the release, but a
# failure turns the pipeline red instead of hiding behind a yellow one. A no-op
# without FLATHUB_GITHUB_TOKEN, which is scoped to the `flathub` environment.
flathub-update-pr:
  extends: .publish-rules
  stage: update
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, api_failure]
  environment:
    name: flathub
    action: prepare
  needs:
    - job: resolve-source
      artifacts: true
    # Ordering only: the tag must be on the GitHub mirror, which Flathub builds.
    - job: mirror-release-to-github
      artifacts: false
  before_script: [apk add --no-cache bash coreutils curl git jq python3]
  script: [./packaging-ci/scripts/flathub-update-pr.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [dist/flathub/]

# Writes the client's GitHub fallback for update metadata: copies the pair
# publish-update-manifest just promoted into the fixed `update-latest` release
# and reads both back anonymously. The client verifies the GitLab signature,
# so GitHub decides nothing. NOT allow_failure (2026-10-07): a GitHub outage
# cannot undo a completed release, but it turns the pipeline red so the stale
# fallback is seen; idempotent, so retrying the job is safe.
mirror-update-manifest-to-github:
  extends: .publish-rules
  stage: update
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  retry:
    max: 2
    when: [script_failure, runner_system_failure, stuck_or_timeout_failure, api_failure]
  environment:
    name: mirror
    action: prepare
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-update-manifest
      artifacts: true
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/mirror-update-manifest-to-github.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [dist/github-update-manifest-mirror.json]
