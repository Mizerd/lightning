# Native macOS arm64 test bundle, built on the physical Mac mini runner
# (10.195.35.7) with the shell executor. There is no macOS container image and
# no supported way to cross-compile a Qt/QML app to macOS, so this is the only
# target in the project that builds on bare metal against a host-installed
# toolchain. The script records the exact toolchain versions it used into
# build-info.json because they are not pinned by an image.
#
# As of 0.7.5 this artifact IS published, on a maintainer decision, as a
# download-only release asset. It is still ad-hoc signed and un-notarized, so
# Gatekeeper blocks it until the user explicitly allows it — the download page
# carries the Open Anyway walkthrough and states the two hard limits (Apple
# Silicon only; macOS 26 or newer, which is where Homebrew's Qt QML frameworks
# put the floor). It is deliberately NOT in the signed update manifest: the
# client has no macOS install strategy, so offering it as an update would
# advertise something the updater refuses to perform.
macos-package-test:
  extends: .macos-test-rules
  stage: build
  tags: [macos, arm64]
  resource_group: lightning-macos-package
  interruptible: true
  # NON-BLOCKING, deliberately. As of 0.7.5 publish-packages consumes this
  # artifact, and one physical Mac being offline, asleep or mid-macOS-update
  # must not hold back a release of the eight Linux and Windows packages.
  # allow_failure is what makes `needs` non-blocking on failure; the optional
  # `needs` entry covers the job not existing at all (BUILD_MACOS_PACKAGES
  # unset). write-manifest.sh then publishes without a macOS entry and says so.
  allow_failure: true
  # 3h is headroom, not an estimate. The same commit built in 10 minutes
  # (pipeline 88) and 2h34m (pipeline 90) because the Mac was idle-sleeping
  # mid-build; cargo reported ~6 minutes of real work in both. See the
  # caffeinate note on `script` below. Pipeline 89 died at the old 2h limit.
  # Re-measure a real baseline now that builds no longer sleep.
  timeout: 3h
  needs:
    - job: resolve-source
      artifacts: true
  variables:
    # Back to 4 after pipeline 89 hit the old 2h timeout while running 6. Given
    # how variable this host's wall clock is, treat that as a precaution rather
    # than a measured result. The step that dominates the run is the
    # single-threaded fat-LTO link, which no value of BUILD_JOBS affects.
    BUILD_JOBS: "4"
  before_script:
    - test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
    - test "$BUILD_MACOS_PACKAGES" = "true"
  script:
    # caffeinate is not optional. macOS idle sleep is driven by user/HID
    # activity and power assertions, NOT by CPU load, so a headless Mac with
    # nobody at the keyboard sleeps mid-build even at 100% CPU. gitlab-runner
    # takes no power assertion of its own. This host was found with `sleep 1`
    # (one minute) and slept 867 seconds in the middle of a build, which is why
    # the same commit took 10 minutes one run and 2.5 hours the next while
    # cargo consistently reported ~6 minutes of actual work.
    #
    # The host setting should also be fixed (`sudo pmset -a sleep 0 disksleep 0
    # powernap 0`), but that is admin-owned and can be reverted by a macOS
    # update or a settings change; this keeps the job correct regardless.
    - caffeinate -dims ./packaging-ci/scripts/prepare-pinned-source-macos.sh
    - caffeinate -dims ./packaging-ci/scripts/build-macos.sh
  artifacts:
    name: "lightning-macos-test-${CI_PIPELINE_ID}"
    when: always
    access: developer
    expire_in: 7 days
    paths:
      - dist/macos/*.zip
      - dist/macos/*.sha256
      - dist/macos/build-info.json
      - dist/macos/reports/

