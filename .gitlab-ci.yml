stages:
  - test
  - resolve
  - build
  - validate
  - publish
  - verify
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

variables:
  LIGHTNING_REPOSITORY:
    value: "https://gitlab.smetonis.net/Mizerd/lightning.git"
    description: "Canonical Lightning source repository (project 6)."
  SOURCE_REF:
    value: "main"
    description: "Build ref. Publication requires a full 40-char commit SHA (create) or vX.Y.Z / SHA (attach-existing)."
  RELEASE_VERSION:
    value: ""
    description: "Application version without a leading v, e.g. 0.6.1. Required to publish."
  RELEASE_ACTION:
    value: "attach-existing"
    options: ["attach-existing", "create"]
    description: "attach-existing links packages to an existing release; create makes the tag+release after publication."
  PUBLISH_PACKAGES:
    value: "false"
    options: ["false", "true"]
    description: "Safe default false. Set true to publish packages to project 6 and finalize the release."
  BUILD_FORMATS:
    value: "all"
    description: "Build-only format selection: 'all' or a comma list from deb,rpm,flatpak,appimage,snap (snap also requires appimage in the list). Publishing pipelines always build every format."
  BUILD_WINDOWS_PACKAGES:
    value: "false"
    options: ["false", "true"]
    description: "Safe default false. Enables unsigned Windows cross-package test artifacts only with BUILD_FORMATS=none on the protected default branch."
  RELEASE_NOTES_B64:
    value: ""
    description: "create only: base64-encoded Markdown notes. Otherwise a tracked docs/releases/vX.Y.Z.md is used."
  BUILD_TYPE: "Release"
  # Per-build parallelism. configure-build.sh derives CMAKE_BUILD_PARALLEL_LEVEL
  # and CARGO_BUILD_JOBS from this; 4 matches the job-container CPU cap on
  # both runner hosts.
  BUILD_JOBS: "4"
  # Publication target is fixed to Lightning project 6 and enforced in-script.
  TARGET_PROJECT_ID: "6"
  LIGHTNING_PROJECT_ID: "6"
  PACKAGE_NAME: "lightning"

.trusted-pipeline:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'

# Shared gate for every publish/verify/release job. Publication is enabled
# only on the packaging project's default branch with PUBLISH_PACKAGES=true.
# The gate deliberately does NOT depend on RELEASE_ACTION, so both actions
# always include the publish, verify, and release jobs.
.publish-rules:
  # Publish-chain API traffic uses the internal GitLab endpoint, matching the
  # runner fleet's polling/clone convention. The public URL is Cloudflare-
  # proxied with a ~100 MB request-body cap, which large package files
  # (Flatpak/AppImage/snap) would exceed. Durable URLs recorded in the
  # manifest and release links stay on the canonical public host; only the
  # in-job requests are routed internally, and credentials stay in headers.
  variables:
    PUBLISH_API_BASE: "http://10.195.35.2/api/v4"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_PACKAGES == "true"'
      when: on_success
    - when: never

# Dedicated Docker-socket runner security gate. A Windows test job is present
# only for a manually created pipeline on the protected default branch with a
# fully pinned project-6 commit and every publication/release input disabled.
.windows-test-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $BUILD_WINDOWS_PACKAGES == "true" && $PUBLISH_PACKAGES == "false" && $BUILD_FORMATS == "none" && $SOURCE_REF =~ /^[0-9a-f]{40}$/ && $RELEASE_VERSION == "" && $RELEASE_NOTES_B64 == ""'
      when: on_success
    - when: never

# Build concurrency is bounded, not free: the build jobs are split across two
# resource groups (a: deb/flatpak/snap, b: rpm/appimage), so at most TWO
# package builds run at once anywhere. Each format's selector tag matches a
# runner on BOTH hosts (the GitLab VM fleet and the mirrored fleet on
# 10.195.35.6), so whichever matching runner is free takes the job. Per-host
# overload is prevented by the hosts themselves: the remote VM runs one job
# globally (concurrent=1), and the GitLab VM job containers are capped at
# 4 CPU / 6 GiB so even two co-located builds leave GitLab EE headroom.
.build-base:
  extends: .trusted-pipeline
  stage: build
  interruptible: true
  timeout: 2h
  needs:
    - job: resolve-source
      artifacts: true
  artifacts:
    name: "lightning-${FORMAT}-${CI_PIPELINE_ID}"
    when: always
    expire_in: 7 days
    paths: [dist/]

config-tests:
  extends: .trusted-pipeline
  stage: test
  image: debian:13.6-slim
  tags: [apt, deb, package]
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      bash ca-certificates git jq python3 python3-yaml
  script:
    - ./tests/test-version.sh
    - ./tests/test-publication.sh
    - ./tests/test-gif-key-injection.sh
    - python3 ./tests/test-pipeline-config.py

resolve-source:
  extends: .trusted-pipeline
  stage: resolve
  image: debian:13.6-slim
  tags: [apt, deb, package]
  needs:
    - job: config-tests
      artifacts: false
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates coreutils git jq
  script:
    - ./scripts/validate-release-request.sh
    - ./scripts/fetch-lightning-source.sh
    - ./scripts/resolve-version.sh
    - ./scripts/write-resolved-env.sh
  artifacts:
    expire_in: 7 days
    paths:
      - dist/source-info.json
      - dist/version.env
      - dist/version.json
      - dist/release-notes.md
    reports:
      dotenv: dist/resolved.env

build-deb:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)deb(,|$)/'
    - when: never
  extends: .build-base
  image: debian:13.6-slim
  tags: [apt, deb, package]
  resource_group: lightning-package-build-a
  variables:
    FORMAT: "deb"
    BASE_IMAGE: "debian:13.6-slim"
    DEBIAN_FRONTEND: "noninteractive"
    RUST_TOOLCHAIN: "1.93.0"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential ca-certificates ccache cmake curl debhelper dpkg-dev
      fakeroot file git jq libsecret-1-dev libsqlite3-dev libssl-dev
      ninja-build patchelf pkg-config qt6-base-dev qt6-declarative-dev
      qt6-multimedia-dev qt6-tools-dev zstd
    - >-
      curl --fail --show-error --silent --location
      --proto '=https' --tlsv1.2 https://sh.rustup.rs
      --output /tmp/rustup-init.sh
    - sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./scripts/prepare-pinned-source.sh
    - ./scripts/build-deb.sh
    - ./scripts/write-build-info.sh deb

build-rpm:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)rpm(,|$)/'
    - when: never
  extends: .build-base
  image: fedora:44
  tags: [dnf, rpm, package]
  resource_group: lightning-package-build-b
  variables:
    FORMAT: "rpm"
    BASE_IMAGE: "fedora:44"
    RUST_TOOLCHAIN: "1.93.0"
  before_script:
    - >-
      dnf install -y
      appstream ca-certificates ccache cmake curl desktop-file-utils
      gcc gcc-c++ git jq libsecret-devel
      ninja-build openssl-devel patchelf pkgconf-pkg-config
      qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel
      qt6-qtsvg-devel qt6-qttools-devel rpm-build sqlite-devel zstd
    # Fedora's system rust (1.96.1) OOMs compiling matrix-sdk under the 6 GiB
    # runner cap; pin the same rustup toolchain the deb/appimage builds use so
    # every Linux format builds the locked SDK identically.
    - >-
      curl --fail --show-error --silent --location
      --proto '=https' --tlsv1.2 https://sh.rustup.rs
      --output /tmp/rustup-init.sh
    - sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./scripts/prepare-pinned-source.sh
    - ./scripts/build-rpm.sh
    - ./scripts/write-build-info.sh rpm

build-flatpak:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)flatpak(,|$)/'
    - when: never
  extends: .build-base
  image: debian:13.6-slim
  tags: [flatpak, package]
  resource_group: lightning-package-build-a
  variables:
    FORMAT: "flatpak"
    BASE_IMAGE: "debian:13.6-slim"
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    # elfutils: flatpak-builder invokes eu-strip/eu-elfcompress for the
    # post-build debuginfo split.
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates curl elfutils flatpak flatpak-builder git jq
      python3 zstd
  script:
    - ./scripts/prepare-pinned-source.sh
    - ./scripts/build-flatpak.sh

build-appimage:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .build-base
  image: debian:13.6-slim
  tags: [appimage, package]
  resource_group: lightning-package-build-b
  variables:
    FORMAT: "appimage"
    BASE_IMAGE: "debian:13.6-slim"
    DEBIAN_FRONTEND: "noninteractive"
    RUST_TOOLCHAIN: "1.93.0"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential ca-certificates ccache cmake curl file git jq
      libsecret-1-dev libsqlite3-dev libssl-dev ninja-build patchelf
      pkg-config qt6-base-dev qt6-declarative-dev qt6-multimedia-dev
      qt6-tools-dev qt6-wayland qml6-module-qtmultimedia
      qml6-module-qtquick qml6-module-qtquick-controls
      qml6-module-qtquick-dialogs qml6-module-qtquick-effects
      qml6-module-qtquick-layouts qml6-module-qtquick-window zstd
    - >-
      curl --fail --show-error --silent --location
      --proto '=https' --tlsv1.2 https://sh.rustup.rs
      --output /tmp/rustup-init.sh
    - sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./scripts/prepare-pinned-source.sh
    - ./scripts/build-appimage.sh

build-snap:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)snap(,|$)/ && $BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .build-base
  image: ubuntu:24.04
  tags: [snap, package]
  resource_group: lightning-package-build-a
  variables:
    FORMAT: "snap"
    BASE_IMAGE: "ubuntu:24.04"
    DEBIAN_FRONTEND: "noninteractive"
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-appimage
      artifacts: true
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates file jq python3 python3-yaml squashfs-tools zstd
  script:
    - ./scripts/build-snap.sh

windows-package-test:
  extends: .windows-test-rules
  stage: build
  image:
    name: lightning-windows-builder:fedora44-qt6.11.1-ffmpeg7.1.1-rust1.95.0-v2
    pull_policy: if-not-present
  tags: [windows-cross, windows-package]
  resource_group: lightning-windows-cross-package
  interruptible: true
  timeout: 2h
  needs:
    - job: resolve-source
      artifacts: true
  variables:
    CARGO_HOME: "/cache/cargo-windows"
    BUILD_JOBS: "4"
  before_script:
    - test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
    - test "$BUILD_WINDOWS_PACKAGES" = "true"
    - test "$PUBLISH_PACKAGES" = "false"
    - test "$BUILD_FORMATS" = "none"
    - test -z "$RELEASE_VERSION"
    - test -z "$RELEASE_NOTES_B64"
  script:
    - ./scripts/prepare-pinned-source.sh
    - ./scripts/build-windows.sh
  artifacts:
    name: "lightning-windows-test-${CI_PIPELINE_ID}"
    when: always
    access: developer
    expire_in: 7 days
    paths:
      - dist/windows/

# Windows is a first-class release target since 0.6.3. In a publishing pipeline
# this builds AND validates the portable/MSI/setup artifacts (build-windows.sh
# calls validate-windows-artifacts.sh) from the same resolved commit as the
# Linux formats, with the GIF keys embedded (fail-closed) and the Rust-only
# backend. Uses the FFmpeg-enabled builder image so inline video decodes with
# ffmpegmediaplugin instead of freezing on the WMF backend.
build-windows:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_PACKAGES == "true"'
      when: on_success
    - when: never
  stage: build
  image:
    name: lightning-windows-builder:fedora44-qt6.11.1-ffmpeg7.1.1-rust1.95.0-v2
    pull_policy: if-not-present
  tags: [windows-cross, windows-package]
  resource_group: lightning-windows-cross-package
  interruptible: true
  timeout: 2h
  needs:
    - job: resolve-source
      artifacts: true
  variables:
    CARGO_HOME: "/cache/cargo-windows"
    BUILD_JOBS: "4"
  before_script:
    - test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
    - test "$PUBLISH_PACKAGES" = "true"
  script:
    - ./scripts/prepare-pinned-source.sh
    - ./scripts/build-windows.sh
  artifacts:
    name: "lightning-windows-${CI_PIPELINE_ID}"
    when: always
    expire_in: 7 days
    paths:
      - dist/windows/

validate-deb:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)deb(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: debian:13.6-slim
  tags: [apt, deb, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-deb
      artifacts: true
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      appstream binutils ca-certificates desktop-file-utils file lintian
      procps shared-mime-info
  script: [./scripts/validate-deb.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.deb
      - dist/*.sha256
      - dist/*deb*.log
      - dist/*deb*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

validate-rpm:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)rpm(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: fedora:44
  tags: [dnf, rpm, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-rpm
      artifacts: true
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - dnf install -y appstream binutils ca-certificates cpio desktop-file-utils file procps-ng rpmlint
  script: [./scripts/validate-rpm.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.rpm
      - dist/*.sha256
      - dist/*rpm*.log
      - dist/*rpm*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

validate-flatpak:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)flatpak(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: debian:13.6-slim
  # Must run on the flatpak runner: installing/running the bundle needs the
  # same bwrap capability as building it.
  tags: [flatpak, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-flatpak
      artifacts: true
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates flatpak
  script: [./scripts/validate-flatpak.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.flatpak
      - dist/*.sha256
      - dist/*flatpak*.log
      - dist/*flatpak*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

validate-appimage:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: debian:13.6-slim
  tags: [appimage, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-appimage
      artifacts: true
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    # Deliberately NO Qt here: the bundle must be self-contained apart from
    # the documented AppImage base-system excludelist.
    # Base-system set the bundle's excludelist legitimately expects from the
    # host, determined empirically in a clean container (loader-resolved:
    # GLVND, harfbuzz, com_err, gpg-error).
    - >-
      apt-get install -y --no-install-recommends
      binutils ca-certificates file libcom-err2 libegl1 libfontconfig1
      libfreetype6 libgl1 libglib2.0-0 libgpg-error0 libharfbuzz0b
      libopengl0 libx11-6 libxcb1 libxext6 libxkbcommon0 zstd
  script: [./scripts/validate-appimage.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.AppImage
      - dist/*.sha256
      - dist/*appimage*.log
      - dist/*appimage*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

validate-snap:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)snap(,|$)/ && $BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: ubuntu:24.04
  tags: [snap, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-snap
      artifacts: true
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    # Base-system libs only (mirrors the AppImage policy); the snap payload
    # bundles Qt itself. No snapd exists in this fleet — validate-snap.sh
    # documents the structural-equivalent validation.
    - >-
      apt-get install -y --no-install-recommends
      binutils ca-certificates file libcom-err2 libegl1 libfontconfig1
      libfreetype6 libgl1 libglib2.0-0 libgpg-error0 libharfbuzz0b
      libopengl0 libx11-6 libxcb1 libxext6 libxkbcommon0
      python3 python3-yaml squashfs-tools zstd
  script: [./scripts/validate-snap.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.snap
      - dist/*.sha256
      - dist/*snap*.log
      - dist/*snap*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

publish-packages:
  extends: .publish-rules
  stage: publish
  image: alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: validate-deb
      artifacts: true
    - job: validate-rpm
      artifacts: true
    - job: validate-flatpak
      artifacts: true
    - job: validate-appimage
      artifacts: true
    - job: validate-snap
      artifacts: true
    - job: build-windows
      artifacts: true
  before_script: [apk add --no-cache bash coreutils curl jq]
  script:
    - ./scripts/write-manifest.sh
    - ./scripts/publish-packages.sh
  artifacts:
    expire_in: 7 days
    paths:
      - dist/manifest.json
      - dist/publication.json

verify-published-packages:
  extends: .publish-rules
  stage: verify
  image: alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-packages
      artifacts: true
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./scripts/verify-published-packages.sh]
  artifacts:
    expire_in: 7 days
    paths:
      - dist/manifest.json
      - dist/verification.json

finalize-release:
  extends: .publish-rules
  stage: release
  image: alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-packages
      artifacts: true
    - job: verify-published-packages
      artifacts: true
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./scripts/finalize-release.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/manifest.json
      - dist/verification.json
