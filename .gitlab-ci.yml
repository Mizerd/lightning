validate-appimage:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [appimage, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-appimage
      artifacts: true
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    # Deliberately NO Qt here: the bundle must be self-contained apart from
    # the documented AppImage base-system excludelist.
    # Base-system set the bundle's excludelist legitimately expects from the
    # host, determined empirically in a clean container (loader-resolved:
    # GLVND, harfbuzz, com_err, gpg-error).
    # The libwayland-* trio joined this list with GitHub issue #9: the
    # bundle deliberately stops shipping its own, because ours was older
    # than the host's and the HOST's Mesa EGL was handed it, aborting the
    # client on every native Wayland session. They are host-provided base
    # system now, exactly like libegl1 and libgl1 above, and libgstopengl
    # links them -- so a container without them cannot load that plugin
    # and the launch check reports missing components. Every desktop that
    # can run a Wayland session has them; this bare image is the
    # artificial case.
    # libxdamage1/libxfixes3/libxtst6 are here for ONE staged plugin:
    # libgstximagesrc, the X11 screen-share fallback. linuxdeploy's excludelist
    # leaves the X libraries on the host — correctly, since that fallback only
    # ever runs on an X11 session, where they are always present — so the
    # validator has to look like such a host or the payload check below
    # reports a plugin that cannot load on a machine where it would.
    - >-
      apt-get install -y --no-install-recommends
      binutils ca-certificates file libasound2t64 libcom-err2 libegl1 libfontconfig1
      libfreetype6 libgl1 libglib2.0-0 libgpg-error0 libharfbuzz0b
      libopengl0 libwayland-client0 libwayland-cursor0 libwayland-egl1
      libx11-6 libxcb1 libxdamage1 libxext6 libxfixes3
      libxkbcommon0 libxtst6 zstd
  script: [./packaging-ci/scripts/validate-appimage.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.AppImage
      - dist/*.sha256
      - dist/*appimage*.log
      - dist/*appimage*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

validate-snap:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)snap(,|$)/ && $BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
