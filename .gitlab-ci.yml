publish-packages:
  extends: .publish-rules
  stage: publish
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    # The mirror token gate: a publishing pipeline never starts writing the
    # immutable registry with a mirror it will then be unable to fill.
    - job: github-mirror-preflight
      artifacts: false
    - job: resolve-source
      artifacts: true
    - job: validate-deb
      artifacts: true
    - job: validate-rpm
      artifacts: true
    - job: validate-flatpak
      artifacts: true
    - job: validate-appimage
      artifacts: true
    - job: validate-snap
      artifacts: true
    - job: build-windows
      artifacts: true
    # macOS, OPTIONAL in both senses: `optional` covers the job not existing
    # (BUILD_MACOS_PACKAGES unset), and the job's own allow_failure covers it
    # existing and failing. Either way the release still publishes, minus the
    # macOS asset. See docs/macos-packaging.md.
    - job: macos-package-test
      artifacts: true
      optional: true
  before_script: [apk add --no-cache bash coreutils curl jq]
  script:
    - ./packaging-ci/scripts/write-manifest.sh
    - ./packaging-ci/scripts/publish-packages.sh
  artifacts:
    expire_in: 7 days
    paths:
      - dist/manifest.json
      - dist/publication.json
      # write-manifest.sh generates SHA256SUMS here, and it is a published
      # release file like any other, so the GitHub mirror job needs its bytes.
      - dist/SHA256SUMS

verify-published-packages:
  extends: .publish-rules
  stage: verify
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-packages
      artifacts: true
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/verify-published-packages.sh]
  artifacts:
    expire_in: 7 days
    paths:
      - dist/manifest.json
      - dist/verification.json

# The signed update manifest is built and signed BEFORE the release is created,
# and published AFTER it. That split is deliberate; see docs/update-manifest.md.
#
#   sign-update-manifest (stage: sign, before release)
#     Generating and signing touch nothing outside this job, so doing them
#     before finalize-release turns a missing/broken signing key into a failure
#     that costs nothing. Discovering it afterwards would mean an immutable tag
#     and release already exist for a version whose update manifest cannot be
#     produced.
#
#   publish-update-manifest (stage: update, after release)
#     The `latest` slot is what every installed Lightning polls, and the
#     manifest's release_notes_url points at the GitLab release page. Promoting
#     it before finalize-release would advertise an update whose release page
#     does not exist yet, and would leave that advertisement standing if the
#     release job then failed. The reverse failure — a finished release whose
#     update manifest has not been promoted yet — is inert and retryable: users
#     simply are not notified until the job is re-run.
#
# Alpine's base image ships libcrypto but not the openssl CLI, so these jobs add
# it explicitly. Nothing else in the publish chain needs it.
sign-update-manifest:
  extends: .publish-rules
  stage: sign
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  # THE SIGNING KEY IS SCOPED TO THE `signing` ENVIRONMENT. A project-level
  # CI variable with no environment scope is injected into EVERY job of the
  # pipeline -- including the six build jobs, each of which runs project-6
  # CMake and every build.rs in the ~500-crate matrix-sdk graph. One hostile
  # build script there could read UPDATE_SIGNING_KEY_B64 and become the
  # release authority for every installed Lightning; the downstream hash
  # checks cannot contain that, because the attacker IS the signer.
  #
  # OPERATOR SETTING (project 7 → Settings → CI/CD → Variables): give
  # UPDATE_SIGNING_KEY_B64 -- and ONLY that variable -- the environment scope
  # `signing`. UPDATE_SIGNING_KEY_ID stays unscoped: it is not secret (it is
  # written into every signature envelope) and the public-key variable name
  # is derived from it, so every job needs it. UPDATE_SIGNING_PUBKEY_<id>
  # stays unscoped too: the build jobs compile it in. Exactly two jobs
  # declare this environment -- resolve-source (the fail-fast consistency
  # check, before any build) and this one -- and both run no project-6 code.
  environment:
    name: signing
    action: prepare
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-packages
      artifacts: true
    - job: verify-published-packages
      artifacts: true
  before_script: [apk add --no-cache bash coreutils curl jq openssl]
  script:
    - ./packaging-ci/scripts/generate-update-manifest.sh
    - ./packaging-ci/scripts/sign-update-manifest.sh
  artifacts:
    expire_in: 30 days
    paths:
      - dist/update-manifest-v1.json
      - dist/update-manifest-v1.json.sig

finalize-release:
  extends: .publish-rules
  stage: release
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-packages
      artifacts: true
    - job: verify-published-packages
      artifacts: true
    # Ordering only: the release must not be created until the update manifest
    # has been proved signable. finalize-release consumes nothing from it.
    - job: sign-update-manifest
      artifacts: false
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/finalize-release.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/manifest.json
      - dist/verification.json

# GitHub bandwidth mirror (MIRROR-SPEC §6). GitLab stays the release authority
# and the canonical binary source; this job uploads byte-identical copies of the
# SAME published artifacts to a GitHub Release at the SAME tag, then proves them
# by re-downloading each one ANONYMOUSLY and comparing SHA-256 against
# dist/manifest.json.
#
# It sits between `release` and `update` for two reasons, both load-bearing:
#   * AFTER finalize-release, because the GitLab tag must exist and be mirrored
#     before a GitHub release can be created at it. The script waits for the
#     mirrored tag and refuses to continue unless it peels to the released
#     commit, so GitHub can never invent a tag of its own.
#   * BEFORE publish-update-manifest, so the `latest` manifest — the one every
#     installed Lightning polls — is promoted only after every mirror_url in it
#     has been proved to serve the right bytes.
#
# With GITHUB_MIRROR_REPO unset the job is a clean no-op and the manifest
# carries no mirror_url, so a pipeline without the variables is unaffected.
# It needs the package bytes themselves, hence the same artifact set as
# publish-packages: it uploads the published files, it does not rebuild them.
mirror-release-to-github:
  extends: .publish-rules
  stage: mirror
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  # The script is idempotent (proved by its tests), so a GitHub hiccup is
  # retried by the runner rather than left for a human to notice.
  retry:
    max: 2
    when: [script_failure, runner_system_failure, stuck_or_timeout_failure, api_failure]
  # In a lull REFRESH (UPDATE_REFRESH_LATEST_ONLY=true) the script exits
  # successfully before touching GitHub: the assets were mirrored when the
  # release was made, and the refresh must never depend on the mirror token.
  # GITHUB_MIRROR_TOKEN is scoped to the `mirror` environment for the same
  # reason the signing key is scoped to `signing` (see sign-update-manifest):
  # a write token for the public mirror has no business in a build job.
  environment:
    name: mirror
    action: prepare
  needs:
    - job: resolve-source
      artifacts: true
    - job: validate-deb
      artifacts: true
    - job: validate-rpm
      artifacts: true
    - job: validate-flatpak
      artifacts: true
    - job: validate-appimage
      artifacts: true
    - job: validate-snap
      artifacts: true
    - job: build-windows
      artifacts: true
    - job: publish-packages
      artifacts: true
    - job: verify-published-packages
      artifacts: true
    # macOS, on the same optional terms publish-packages uses. This job uploads
    # the PUBLISHED BYTES and refuses to rebuild them, so it needs every file
    # the publication manifest names — and publish-packages puts the macOS zip
    # in that manifest. Pipeline 110 shipped without this line: the release
    # published fine and the mirror died on "mirror input missing", after the
    # tag and the GitLab release already existed.
    - job: macos-package-test
      artifacts: true
      optional: true
    # The signed manifest's mirror_url values are cross-checked against the URLs
    # this job actually creates, before anything is uploaded.
    - job: sign-update-manifest
      artifacts: true
    # Ordering only: GitLab is the release authority, so the mirror is never
    # created before the real release exists. Nothing is consumed from this job.
    - job: finalize-release
      artifacts: false
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/mirror-release-to-github.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/manifest.json
      - dist/github-mirror.json

publish-update-manifest:
  extends: .publish-rules
  stage: update
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  needs:
    - job: resolve-source
      artifacts: true
    - job: verify-published-packages
      artifacts: true
    - job: sign-update-manifest
      artifacts: true
    # Ordering only: the `latest` pointer must never advertise a release that
    # has not been finalized. Nothing is consumed from this job.
    - job: finalize-release
      artifacts: false
    # Ordering only: a promoted mirror_url must already have been proved to
    # serve the right bytes. Nothing is consumed from this job.
    - job: mirror-release-to-github
      artifacts: false
  before_script: [apk add --no-cache bash coreutils curl jq openssl]
  script: [./packaging-ci/scripts/publish-update-manifest.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dist/update-manifest-v1.json
      - dist/update-manifest-v1.json.sig
      - dist/update-publication.json

# The client's GitHub FALLBACK for update metadata. Every installed Lightning
# compiles in `…/releases/download/update-latest/…` on the mirror and reads it
# only when the canonical GitLab host does not answer; until 2026-09-03 no
# job ever wrote that slot, so the fallback was inert. This job copies the
# pair GitLab has JUST promoted (publish-update-manifest's record is the
# proof) into that fixed release, replacing the previous pair, and reads
# both back anonymously. GitHub decides nothing: the manifest is signed on
# GitLab and the client verifies it. allow_failure, because a GitHub outage
# must never fail a release GitLab has completed; retried because a hiccup
# should not need a human either; idempotent, so both are safe.
mirror-update-manifest-to-github:
  extends: .publish-rules
  stage: update
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  resource_group: lightning-project-6-publication
  allow_failure: true
  retry:
    max: 2
    when: [script_failure, runner_system_failure, stuck_or_timeout_failure, api_failure]
  environment:
    name: mirror
    action: prepare
  needs:
    - job: resolve-source
      artifacts: true
    - job: publish-update-manifest
      artifacts: true
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/mirror-update-manifest-to-github.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [dist/github-update-manifest-mirror.json]
