stages:
  - test
  - resolve
  - build
  - validate
  - publish
  - verify
  - sign
  - release
  - mirror
  - update

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

variables:
  LIGHTNING_REPOSITORY:
    value: "https://gitlab.smetonis.net/Mizerd/lightning.git"
    description: "Canonical Lightning source repository (project 6)."
  SOURCE_REF:
    value: "main"
    description: "Build ref. Publication requires a full 40-char commit SHA (create) or vX.Y.Z / SHA (attach-existing)."
  RELEASE_VERSION:
    value: ""
    description: "Application version without a leading v, e.g. 0.6.1. Required to publish."
  RELEASE_ACTION:
    value: "attach-existing"
    options: ["attach-existing", "create"]
    description: "attach-existing links packages to an existing release; create makes the tag+release after publication."
  PUBLISH_PACKAGES:
    value: "false"
    options: ["false", "true"]
    description: "Safe default false. Set true to publish packages to project 6 and finalize the release."
  BUILD_FORMATS:
    value: "all"
    description: "Build-only format selection: 'all' or a comma list from deb,rpm,flatpak,appimage,snap (snap also requires appimage in the list). Publishing pipelines always build every format."
  BUILD_WINDOWS_PACKAGES:
    value: "false"
    options: ["false", "true"]
    description: "Safe default false. Enables unsigned Windows cross-package test artifacts only with BUILD_FORMATS=none on the protected default branch."
  BUILD_MACOS_PACKAGES:
    value: "false"
    options: ["false", "true"]
    description: "Safe default false. Enables the unsigned macOS arm64 .app bundle on the protected default branch with a pinned 40-char SOURCE_REF. Runs on the physical Mac mini runner, in parallel with the Linux fleet when BUILD_FORMATS is also set. Since 0.7.5 a publishing pipeline ships it as a download-only asset (Apple Silicon, macOS 26+, unsigned); the job is non-blocking, so the Mac being unavailable publishes the release without it."
  RELEASE_NOTES_B64:
    value: ""
    description: "create only: base64-encoded Markdown notes. Otherwise a tracked docs/releases/vX.Y.Z.md is used."
  BUILD_TYPE: "Release"
  # Per-build parallelism. configure-build.sh derives CMAKE_BUILD_PARALLEL_LEVEL
  # and CARGO_BUILD_JOBS from this; 4 matches the job-container CPU cap on
  # both runner hosts.
  BUILD_JOBS: "4"
  # Publication target is fixed to Lightning project 6 and enforced in-script.
  TARGET_PROJECT_ID: "6"
  LIGHTNING_PROJECT_ID: "6"
  PACKAGE_NAME: "lightning"

.trusted-pipeline:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'

# Shared gate for every publish/verify/release job. Publication is enabled
# only on the packaging project's default branch with PUBLISH_PACKAGES=true.
# The gate deliberately does NOT depend on RELEASE_ACTION, so both actions
# always include the publish, verify, and release jobs.
.publish-rules:
  # Publish-chain API traffic uses the internal GitLab endpoint, matching the
  # runner fleet's polling/clone convention. The public URL is Cloudflare-
  # proxied with a ~100 MB request-body cap, which large package files
  # (Flatpak/AppImage/snap) would exceed. Durable URLs recorded in the
  # manifest and release links stay on the canonical public host; only the
  # in-job requests are routed internally, and credentials stay in headers.
  variables:
    PUBLISH_API_BASE: "http://10.195.35.2/api/v4"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_PACKAGES == "true"'
      when: on_success
    - when: never

# Native macOS gate: protected default branch, manually created pipeline, fully
# pinned project-6 commit, and an explicit opt-in.
#
# Deliberately NOT constrained on BUILD_FORMATS, BUILD_WINDOWS_PACKAGES, or
# PUBLISH_PACKAGES. The Mac is a dedicated host that shares nothing with the
# Linux/Windows pools, so there is no capacity reason to exclude it from a
# full-fleet run — and excluding it would mean macOS silently missing from
# exactly the pipelines that build every other platform. With BUILD_FORMATS=none
# this still yields a macOS-only pipeline; with BUILD_FORMATS=all it runs
# alongside the Linux fleet, in parallel, on its own runner.
#
# It still never publishes: no publish job consumes its artifact and it has no
# release action. See docs/macos-packaging.md.
.macos-test-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $BUILD_MACOS_PACKAGES == "true" && $SOURCE_REF =~ /^[0-9a-f]{40}$/'
      when: on_success
    - when: never

# Dedicated Docker-socket runner security gate. A Windows test job is present
# only for a manually created pipeline on the protected default branch with a
# fully pinned project-6 commit and every publication/release input disabled.
.windows-test-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $BUILD_WINDOWS_PACKAGES == "true" && $PUBLISH_PACKAGES == "false" && $BUILD_FORMATS == "none" && $SOURCE_REF =~ /^[0-9a-f]{40}$/ && $RELEASE_VERSION == "" && $RELEASE_NOTES_B64 == ""'
      when: on_success
    - when: never

# Build concurrency is bounded, not free: the build jobs are split across two
# resource groups (a: deb/flatpak/snap, b: rpm/appimage), so at most TWO
# package builds run at once anywhere. Each format's selector tag matches a
# runner on BOTH hosts (the GitLab VM fleet and the mirrored fleet on
# 10.195.35.6), so whichever matching runner is free takes the job. Per-host
# overload is prevented by the hosts themselves: the remote VM runs one job
# globally (concurrent=1), and the GitLab VM job containers are capped at
# 4 CPU / 6 GiB so even two co-located builds leave GitLab EE headroom.
.build-base:
  extends: .trusted-pipeline
  stage: build
  interruptible: true
  timeout: 2h
  needs:
    - job: resolve-source
      artifacts: true
  artifacts:
    name: "lightning-${FORMAT}-${CI_PIPELINE_ID}"
    when: always
    expire_in: 7 days
    paths: [dist/]

config-tests:
  extends: .trusted-pipeline
  stage: test
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [apt, deb, package]
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    # build-essential + cmake are for test-windows-version-resources.sh only: it drives the
    # per-target version-resource injection against a two-executable stand-in
    # project, which is the one part of the Windows metadata contract that
    # cannot be checked by reading a file. It needs a real CMake plus a
    # COMPLETE C toolchain for project(LANGUAGES C) -- a bare `gcc` under
    # --no-install-recommends omits libc6-dev and cannot link, and no `make`
    # leaves CMake without its default generator. Both were found the hard
    # way (pipelines 99 and 100). It compiles nothing of Lightning's.
    - >-
      apt-get install -y --no-install-recommends
      bash build-essential ca-certificates cmake git jq openssl python3 python3-yaml
  script:
    - ./packaging-ci/tests/test-version.sh
    - ./packaging-ci/tests/test-publication.sh
    - ./packaging-ci/tests/test-update-manifest.sh
    - ./packaging-ci/tests/test-gif-key-injection.sh
    - ./packaging-ci/tests/test-windows-version-resources.sh
    - python3 ./packaging-ci/tests/test-pipeline-config.py
    - python3 ./packaging-ci/tests/test-windows-metadata.py
    # Committed with the MSI payload work and invoked by nothing until
    # 2026-09-06 -- the same "a test file can be unregistered" trap that hid
    # nineteen shortcut cases, this time on the Windows install surface.
    - python3 ./packaging-ci/tests/test-msi-payload-completeness.py
    - python3 ./packaging-ci/tests/test-release-notes-policy.py
    # The launcher entry and the icons it names -- the window icon, which on
    # Wayland is decided by packaging alone: Qt implements no icon protocol
    # there, so setWindowIcon() is inert and the compositor resolves the app id
    # to a desktop entry or draws a placeholder. Reported against 0.9.x, once
    # the AppImage stopped falling back to XWayland.
    - python3 ./packaging-ci/tests/test-appimage-desktop-entry.py

# Proves the GitHub mirror can be written BEFORE anything is published. The
# mirror job runs after the GitLab tag and release exist, so a dead or
# expiring token found there fails a release at its most expensive moment
# and leaves installed clients without their GitHub fallback. Fine-grained
# GitHub tokens expire (one year at most); this job refuses to start a
# publishing pipeline on one with fewer than two days left and warns from
# thirty. It holds only the mirror token (environment `mirror`) and is a
# clean no-op when GITHUB_MIRROR_REPO is unset. publish-packages `needs` it,
# which is what makes it a gate rather than a report.
github-mirror-preflight:
  extends: .publish-rules
  stage: resolve
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  needs: []
  # HARD: a release that cannot reach GitHub is the failure this job exists
  # to prevent, and it must be found before publication. The one publishing
  # run that needs nothing from GitHub -- the lull REFRESH of the manifest
  # (UPDATE_REFRESH_LATEST_ONLY=true) -- is recognised by the script itself,
  # which exits successfully without touching GitHub, so a dead token can
  # never block the refresh that keeps GitLab-reachable clients current.
  retry:
    max: 2
    when: [script_failure, runner_system_failure, stuck_or_timeout_failure, api_failure]
  environment:
    name: mirror
    action: prepare
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/github-mirror-preflight.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [dist/github-mirror-preflight.json]

resolve-source:
  extends: .trusted-pipeline
  stage: resolve
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [apt, deb, package]
  # THE FIRST JOB HOLDS THE SIGNING KEY, AND ONLY THIS JOB AND THE SIGNING JOB
  # DO. resolve-source executes no project-6 code -- it clones, resolves a
  # ref, and reads a version out of a file -- so the private key is safe
  # here, and here is where the key/package consistency check MUST run: the
  # build jobs bake the public half into every artifact, and a mismatch found
  # after them is found after the packages are immutable. With the variable
  # environment-scoped to `signing` (see sign-update-manifest) the six build
  # jobs, which run project-6 CMake and every build.rs, never see it.
  environment:
    name: signing
    action: prepare
  needs:
    - job: config-tests
      artifacts: false
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    # openssl: validate-release-request.sh derives the public half of the update
    # signing key here, in the FIRST job, so a key/package mismatch fails before
    # any build job embeds the wrong trust root into an artifact.
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates coreutils git jq openssl
  script:
    - ./packaging-ci/scripts/validate-release-request.sh
    - ./packaging-ci/scripts/fetch-lightning-source.sh
    - ./packaging-ci/scripts/resolve-version.sh
    - ./packaging-ci/scripts/write-resolved-env.sh
  artifacts:
    expire_in: 7 days
    paths:
      - dist/source-info.json
      - dist/version.env
      - dist/version.json
      - dist/release-notes.md
    reports:
      dotenv: dist/resolved.env

build-deb:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)deb(,|$)/'
    - when: never
  extends: .build-base
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [apt, deb, package]
  resource_group: lightning-package-build-a
  variables:
    FORMAT: "deb"
    BASE_IMAGE: "debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
    DEBIAN_FRONTEND: "noninteractive"
    RUST_TOOLCHAIN: "1.93.0"
    RUSTUP_VERSION: "1.29.1"
    # sha256 of static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
    RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential ca-certificates ccache cmake curl debhelper dpkg-dev
      fakeroot file git jq libsecret-1-dev libsqlite3-dev libssl-dev
      ninja-build patchelf pkg-config qt6-base-dev qt6-base-private-dev qt6-declarative-dev
      qt6-multimedia-dev qt6-tools-dev zstd
    # GStreamer development files for the voice/video call media engine. The
    # source's LIGHTNING_ENABLE_WEBRTC option is gated on a pkg-config probe of
    # gstreamer-1.0, gstreamer-webrtc-1.0, gstreamer-sdp-1.0, gstreamer-app-1.0,
    # gstreamer-video-1.0 and gstreamer-rtp-1.0; without these packages the probe
    # fails, CMake configures the engine OUT in one STATUS line, and the package
    # ships a client that refuses every call. That is exactly how 0.8.0 shipped
    # on every Linux format. configure-build.sh now asserts the staged binary
    # carries the engine, so removing these fails the BUILD rather than a user.
    - >-
      apt-get install -y --no-install-recommends
      libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      libgstreamer-plugins-bad1.0-dev
    # The rustup INSTALLER is version-addressed and checksum-verified before it
    # runs. `sh.rustup.rs` was the one unverified executable in this pipeline:
    # TLS alone proved who served it, not what it was, and it builds the Rust
    # Matrix SDK -- E2EE, key handling, token storage -- into every signed
    # package. Every other download here is pinned; this one now is too.
    - >-
      curl --fail --show-error --silent --location --max-redirs 3
      --proto '=https' --tlsv1.2
      "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
      --output /tmp/rustup-init
    - printf '%s  /tmp/rustup-init\n' "$RUSTUP_INIT_SHA256" | sha256sum -c -
    - chmod +x /tmp/rustup-init
    - /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-deb.sh
    - ./packaging-ci/scripts/write-build-info.sh deb

build-rpm:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)rpm(,|$)/'
    - when: never
  extends: .build-base
  image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # fedora:44
  tags: [dnf, rpm, package]
  resource_group: lightning-package-build-b
  variables:
    FORMAT: "rpm"
    BASE_IMAGE: "fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80"
    RUST_TOOLCHAIN: "1.93.0"
    RUSTUP_VERSION: "1.29.1"
    # sha256 of static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
    RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
  before_script:
    - >-
      dnf install -y
      appstream ca-certificates ccache cmake curl desktop-file-utils
      gcc gcc-c++ git jq libsecret-devel
      ninja-build openssl-devel patchelf pkgconf-pkg-config
      qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel
      qt6-qtsvg-devel qt6-qttools-devel rpm-build sqlite-devel zstd
    # GStreamer development files for the voice/video call media engine. The
    # source's LIGHTNING_ENABLE_WEBRTC option is gated on a pkg-config probe of
    # gstreamer-1.0, gstreamer-webrtc-1.0, gstreamer-sdp-1.0, gstreamer-app-1.0,
    # gstreamer-video-1.0 and gstreamer-rtp-1.0; without these packages the probe
    # fails, CMake configures the engine OUT in one STATUS line, and the package
    # ships a client that refuses every call. That is exactly how 0.8.0 shipped
    # on every Linux format. configure-build.sh now asserts the staged binary
    # carries the engine, so removing these fails the BUILD rather than a user.
    - >-
      dnf install -y
      gstreamer1-devel gstreamer1-plugins-base-devel
      gstreamer1-plugins-bad-free-devel
    # Fedora's system rust (1.96.1) OOMs compiling matrix-sdk under the 6 GiB
    # runner cap; pin the same rustup toolchain the deb/appimage builds use so
    # every Linux format builds the locked SDK identically.
    # The rustup INSTALLER is version-addressed and checksum-verified before it
    # runs. `sh.rustup.rs` was the one unverified executable in this pipeline:
    # TLS alone proved who served it, not what it was, and it builds the Rust
    # Matrix SDK -- E2EE, key handling, token storage -- into every signed
    # package. Every other download here is pinned; this one now is too.
    - >-
      curl --fail --show-error --silent --location --max-redirs 3
      --proto '=https' --tlsv1.2
      "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
      --output /tmp/rustup-init
    - printf '%s  /tmp/rustup-init\n' "$RUSTUP_INIT_SHA256" | sha256sum -c -
    - chmod +x /tmp/rustup-init
    - /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-rpm.sh
    - ./packaging-ci/scripts/write-build-info.sh rpm

build-flatpak:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)flatpak(,|$)/'
    - when: never
  extends: .build-base
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [flatpak, package]
  resource_group: lightning-package-build-a
  variables:
    FORMAT: "flatpak"
    BASE_IMAGE: "debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    # elfutils: flatpak-builder invokes eu-strip/eu-elfcompress for the
    # post-build debuginfo split.
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates curl elfutils flatpak flatpak-builder git jq
      python3 zstd
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-flatpak.sh

build-appimage:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .build-base
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [appimage, package]
  resource_group: lightning-package-build-b
  variables:
    FORMAT: "appimage"
    BASE_IMAGE: "debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
    DEBIAN_FRONTEND: "noninteractive"
    RUST_TOOLCHAIN: "1.93.0"
    RUSTUP_VERSION: "1.29.1"
    # sha256 of static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
    RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential ca-certificates ccache cmake curl file git jq
      libsecret-1-dev libsqlite3-dev libssl-dev ninja-build patchelf
      pkg-config qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-multimedia-dev
      qt6-tools-dev qt6-wayland qml6-module-qtmultimedia
      qml6-module-qtquick qml6-module-qtquick-controls
      qml6-module-qtquick-dialogs qml6-module-qtquick-effects
      qml6-module-qtquick-layouts qml6-module-qtquick-window zstd
    # GStreamer development files for the voice/video call media engine. The
    # source's LIGHTNING_ENABLE_WEBRTC option is gated on a pkg-config probe of
    # gstreamer-1.0, gstreamer-webrtc-1.0, gstreamer-sdp-1.0, gstreamer-app-1.0,
    # gstreamer-video-1.0 and gstreamer-rtp-1.0; without these packages the probe
    # fails, CMake configures the engine OUT in one STATUS line, and the package
    # ships a client that refuses every call. That is exactly how 0.8.0 shipped
    # on every Linux format. configure-build.sh now asserts the staged binary
    # carries the engine, so removing these fails the BUILD rather than a user.
    - >-
      apt-get install -y --no-install-recommends
      libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      libgstreamer-plugins-bad1.0-dev
    # ...and the RUNTIME plugins, which the AppImage BUNDLES rather than
    # depends on (build-appimage.sh stages them into the AppDir before
    # linuxdeploy runs, so their own libraries are resolved too). The deb and
    # rpm declare these as package dependencies instead; an AppImage has
    # nobody to declare them to. The snap inherits this AppDir, so it inherits
    # this list as well.
    - >-
      apt-get install -y --no-install-recommends
      gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-pipewire
      gstreamer1.0-alsa gstreamer1.0-gl
      libspa-0.2-modules libpipewire-0.3-modules
    # THE LAST TWO ABOVE ARE NOT PULLED IN BY gstreamer1.0-pipewire, and their
    # absence is invisible until a share is attempted: libpipewire dlopens its
    # SPA plugins and PipeWire modules itself, so the bundle got the library and
    # none of what the library loads. That is the 0.8.0/142 screen-share
    # failure. build-appimage.sh stages only the subset it needs.
    #
    # client.conf comes from pipewire-bin, which is a 55-package install in this
    # image (libpulse, libroc, libavahi, X libs) for ONE 4 KB file. Downloading
    # and unpacking it installs nothing.
    - >-
      ( cd /tmp && apt-get download pipewire-bin
      && dpkg-deb -x pipewire-bin_*.deb /opt/pipewire-conf )
    - test -f /opt/pipewire-conf/usr/share/pipewire/client.conf
    # Qt IMAGE-FORMAT plugins, bundled for the same reason as the GStreamer
    # ones: they are dlopen'd, so linuxdeploy-plugin-qt deployed only the three
    # qtbase itself carries (gif, ico, jpeg) and every AppImage up to 0.8.0
    # shipped a client that ACCEPTS image/webp in its own byte sniffers and
    # cannot draw it.
    #
    #   qt6-image-formats-plugins : libqwebp.so (240 kB package)
    #   libjxl0.11                : the JPEG XL runtime kimg_jxl.so links
    #
    # JPEG XL does NOT come from Qt. qt/qtimageformats has never contained a
    # JXL plugin (v6.11.1 is dds/icns/jp2/macheif/macjp2/mng/tga/tiff/wbmp/webp);
    # the only Qt JXL decoder is KDE's kimageformats. That package is UNPACKED
    # rather than installed, exactly as pipewire-bin is above: installing it
    # pulls libheif, libraw, OpenEXR, x265 and libavif into the image, and drops
    # kimg_avif.so and kimg_heif.so into the very directory build-appimage.sh
    # stages from — neither of which is shipped, deliberately (see the script).
    - >-
      apt-get install -y --no-install-recommends
      qt6-image-formats-plugins libjxl0.11
    - >-
      ( cd /tmp && apt-get download kimageformat6-plugins
      && dpkg-deb -x kimageformat6-plugins_*.deb /opt/kimageformats )
    - >-
      test -f /opt/kimageformats/usr/lib/x86_64-linux-gnu/qt6/plugins/imageformats/kimg_jxl.so
    # The rustup INSTALLER is version-addressed and checksum-verified before it
    # runs. `sh.rustup.rs` was the one unverified executable in this pipeline:
    # TLS alone proved who served it, not what it was, and it builds the Rust
    # Matrix SDK -- E2EE, key handling, token storage -- into every signed
    # package. Every other download here is pinned; this one now is too.
    - >-
      curl --fail --show-error --silent --location --max-redirs 3
      --proto '=https' --tlsv1.2
      "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
      --output /tmp/rustup-init
    - printf '%s  /tmp/rustup-init\n' "$RUSTUP_INIT_SHA256" | sha256sum -c -
    - chmod +x /tmp/rustup-init
    - /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-appimage.sh

