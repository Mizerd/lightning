stages:
  - test
  - resolve
  - build
  - validate
  - publish
  - verify
  - sign
  - release
  - mirror
  - update

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

variables:
  LIGHTNING_REPOSITORY:
    value: "https://gitlab.smetonis.net/Mizerd/lightning.git"
    description: "Canonical Lightning source repository (project 6)."
  SOURCE_REF:
    value: "main"
    description: "Build ref. Publication requires a full 40-char commit SHA (create) or vX.Y.Z / SHA (attach-existing)."
  RELEASE_VERSION:
    value: ""
    description: "Application version without a leading v, e.g. 0.6.1. Required to publish."
  RELEASE_ACTION:
    value: "attach-existing"
    options: ["attach-existing", "create"]
    description: "attach-existing links packages to an existing release; create makes the tag+release after publication."
  PUBLISH_PACKAGES:
    value: "false"
    options: ["false", "true"]
    description: "Safe default false. Set true to publish packages to project 6 and finalize the release."
  BUILD_FORMATS:
    value: "all"
    description: "Build-only format selection: 'all' or a comma list from deb,rpm,flatpak,appimage,snap (snap also requires appimage in the list). Publishing pipelines always build every format."
  BUILD_WINDOWS_PACKAGES:
    value: "false"
    options: ["false", "true"]
    description: "Safe default false. Enables unsigned Windows cross-package test artifacts only with BUILD_FORMATS=none on the protected default branch."
  BUILD_MACOS_PACKAGES:
    value: "false"
    options: ["false", "true"]
    description: "Safe default false. Enables the unsigned macOS arm64 .app bundle on the protected default branch with a pinned 40-char SOURCE_REF. Runs on the physical Mac mini runner, in parallel with the Linux fleet when BUILD_FORMATS is also set. Since 0.7.5 a publishing pipeline ships it as a download-only asset (Apple Silicon, macOS 26+, unsigned); the job is non-blocking, so the Mac being unavailable publishes the release without it."
  RELEASE_NOTES_B64:
    value: ""
    description: "create only: base64-encoded Markdown notes. Otherwise a tracked docs/releases/vX.Y.Z.md is used."
  BUILD_TYPE: "Release"
  # configure-build.sh derives CMAKE_BUILD_PARALLEL_LEVEL and CARGO_BUILD_JOBS
  # from this; 4 matches the job-container CPU cap on both runner hosts.
  BUILD_JOBS: "4"
  # Publication target is fixed to Lightning project 6 and enforced in-script.
  TARGET_PROJECT_ID: "6"
  LIGHTNING_PROJECT_ID: "6"
  PACKAGE_NAME: "lightning"

.trusted-pipeline:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'

# Shared gate for every publish/verify/release job: default branch with
# PUBLISH_PACKAGES=true. Independent of RELEASE_ACTION, so both actions run
# the publish, verify and release jobs.
.publish-rules:
  # In-job API requests use the internal endpoint: the public URL sits behind
  # a ~100 MB request-body cap that large packages exceed. URLs recorded in the
  # manifest and release links stay on the public host.
  variables:
    PUBLISH_API_BASE: "http://10.195.35.2/api/v4"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_PACKAGES == "true"'
      when: on_success
    - when: never

# Native macOS gate: protected default branch, manually created pipeline, fully
# pinned project-6 commit, and an explicit opt-in.
#
# Not constrained on BUILD_FORMATS or PUBLISH_PACKAGES: the Mac is a dedicated
# host, so it runs alongside the Linux fleet rather than being silently left
# out of full-fleet pipelines. BUILD_FORMATS=none gives a macOS-only pipeline.
# See docs/macos-packaging.md.
.macos-test-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $BUILD_MACOS_PACKAGES == "true" && $SOURCE_REF =~ /^[0-9a-f]{40}$/'
      when: on_success
    - when: never

# Dedicated Docker-socket runner security gate. A Windows test job is present
# only for a manually created pipeline on the protected default branch with a
# fully pinned project-6 commit and every publication/release input disabled.
.windows-test-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $BUILD_WINDOWS_PACKAGES == "true" && $PUBLISH_PACKAGES == "false" && $BUILD_FORMATS == "none" && $SOURCE_REF =~ /^[0-9a-f]{40}$/ && $RELEASE_VERSION == "" && $RELEASE_NOTES_B64 == ""'
      when: on_success
    - when: never

# Build jobs are split across resource groups (a: deb/flatpak/snap,
# b: rpm/appimage, c: Ubuntu deb) to bound concurrent package builds. Each
# selector tag matches a runner on both hosts; the remote VM runs one job at a
# time and the GitLab VM containers are capped at 4 CPU / 6 GiB.
.build-base:
  extends: .trusted-pipeline
  stage: build
  interruptible: true
  timeout: 2h
  needs:
    - job: resolve-source
      artifacts: true
  artifacts:
    name: "lightning-${FORMAT}-${CI_PIPELINE_ID}"
    when: always
    expire_in: 7 days
    paths: [dist/]

config-tests:
  extends: .trusted-pipeline
  stage: test
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [apt, deb, package]
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    # build-essential + cmake are for test-windows-version-resources.sh, which
    # configures a stand-in C project: a bare `gcc` under
    # --no-install-recommends lacks libc6-dev and `make`.
    - >-
      apt-get install -y --no-install-recommends
      bash build-essential ca-certificates cmake git jq openssl python3 python3-yaml
  script:
    - ./packaging-ci/tests/test-version.sh
    - ./packaging-ci/tests/test-publication.sh
    - ./packaging-ci/tests/test-update-manifest.sh
    - ./packaging-ci/tests/test-gif-key-injection.sh
    - ./packaging-ci/tests/test-windows-version-resources.sh
    - python3 ./packaging-ci/tests/test-pipeline-config.py
    - python3 ./packaging-ci/tests/test-windows-metadata.py
    # The Flathub submission manifest in the repository root.
    - python3 ./packaging-ci/tests/test-flathub-manifest-pin.py
    - python3 ./packaging-ci/tests/test-msi-payload-completeness.py
    - python3 ./packaging-ci/tests/test-release-notes-policy.py
    # On Wayland the window icon comes from the desktop entry alone; Qt's
    # setWindowIcon() is inert there.
    - python3 ./packaging-ci/tests/test-appimage-desktop-entry.py
    # Metainfo screenshot URLs and newest <release>. The package validators run
    # `appstreamcli validate --no-net`, which cannot see a dead URL; this
    # checks the pinned files offline with `git ls-tree`.
    - python3 ./packaging-ci/tests/test-metainfo-consistency.py

# Proves the GitHub mirror token works before anything is published, since the
# mirror job only runs after the GitLab tag and release exist. Refuses a token
# with fewer than two days left and warns from thirty. Holds only the mirror
# token (environment `mirror`); a no-op when GITHUB_MIRROR_REPO is unset.
# publish-packages `needs` it, which makes it a gate.
github-mirror-preflight:
  extends: .publish-rules
  stage: resolve
  image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce # alpine:3.22
  needs: []
  # Hard failure by design. A manifest refresh (UPDATE_REFRESH_LATEST_ONLY=true)
  # needs nothing from GitHub; the script exits successfully for it, so a dead
  # token never blocks the refresh.
  retry:
    max: 2
    when: [script_failure, runner_system_failure, stuck_or_timeout_failure, api_failure]
  environment:
    name: mirror
    action: prepare
  before_script: [apk add --no-cache bash coreutils curl jq]
  script: [./packaging-ci/scripts/github-mirror-preflight.sh]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [dist/github-mirror-preflight.json]

resolve-source:
  extends: .trusted-pipeline
  stage: resolve
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [apt, deb, package]
  # Only this job and the signing job see the private signing key (environment
  # `signing`). It executes no project-6 code, and the key/package consistency
  # check must run before the build jobs embed the public half in artifacts.
  environment:
    name: signing
    action: prepare
  needs:
    - job: config-tests
      artifacts: false
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    # openssl: validate-release-request.sh derives the public signing key here.
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates coreutils git jq openssl
  script:
    - ./packaging-ci/scripts/validate-release-request.sh
    - ./packaging-ci/scripts/fetch-lightning-source.sh
    - ./packaging-ci/scripts/resolve-version.sh
    - ./packaging-ci/scripts/write-resolved-env.sh
  artifacts:
    expire_in: 7 days
    paths:
      - dist/source-info.json
      - dist/version.env
      - dist/version.json
      - dist/release-notes.md
    reports:
      dotenv: dist/resolved.env

build-deb:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)deb(,|$)/'
    - when: never
  extends: .build-base
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [apt, deb, package]
  resource_group: lightning-package-build-a
  variables:
    FORMAT: "deb"
    BASE_IMAGE: "debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
    DEBIAN_FRONTEND: "noninteractive"
    RUST_TOOLCHAIN: "1.93.0"
    RUSTUP_VERSION: "1.29.1"
    # sha256 of static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
    RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential ca-certificates ccache cmake curl debhelper dpkg-dev
      fakeroot file git jq libsecret-1-dev libsqlite3-dev libssl-dev
      ninja-build patchelf pkg-config qt6-base-dev qt6-base-private-dev qt6-declarative-dev
      qt6-multimedia-dev qt6-svg-dev qt6-tools-dev zstd
    # GStreamer development files for the call media engine; without them the
    # pkg-config probe fails and the build is rejected.
    - >-
      apt-get install -y --no-install-recommends
      libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      libgstreamer-plugins-bad1.0-dev
    # The rustup installer is version-pinned and checksum-verified before it runs.
    - >-
      curl --fail --show-error --silent --location --max-redirs 3
      --proto '=https' --tlsv1.2
      "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
      --output /tmp/rustup-init
    - printf '%s  /tmp/rustup-init\n' "$RUSTUP_INIT_SHA256" | sha256sum -c -
    - chmod +x /tmp/rustup-init
    - /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-deb.sh
    - ./packaging-ci/scripts/write-build-info.sh deb

# Second deb lane: Ubuntu 26.04 LTS.
#
# dpkg-shlibdeps bakes the build host's library versions into Depends, so the
# Debian 13 deb requires Qt >= 6.8.2, which Ubuntu 24.04 (Qt 6.4.2, and no
# qml6-module-qtquick-effects) cannot meet. 24.04 users get the AppImage or
# Flatpak. This is the Debian job with a different image, DEB_SUFFIX and
# resource_group only.
build-deb-ubuntu:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)deb(,|$)/'
    - when: never
  extends: .build-base
  image: ubuntu@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d # ubuntu:26.04
  tags: [apt, deb, package]
  resource_group: lightning-package-build-c
  variables:
    FORMAT: "deb"
    BASE_IMAGE: "ubuntu@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d"
    # The Debian lane leaves this empty so its filename never moves.
    DEB_SUFFIX: "ubuntu2604"
    DEBIAN_FRONTEND: "noninteractive"
    RUST_TOOLCHAIN: "1.93.0"
    RUSTUP_VERSION: "1.29.1"
    # sha256 of static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
    RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential ca-certificates ccache cmake curl debhelper dpkg-dev
      fakeroot file git jq libsecret-1-dev libsqlite3-dev libssl-dev
      ninja-build patchelf pkg-config qt6-base-dev qt6-base-private-dev qt6-declarative-dev
      qt6-multimedia-dev qt6-svg-dev qt6-tools-dev zstd
    # GStreamer development files for the call media engine; without them the
    # pkg-config probe fails and the build is rejected.
    - >-
      apt-get install -y --no-install-recommends
      libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      libgstreamer-plugins-bad1.0-dev
    # The rustup installer is version-pinned and checksum-verified before it runs.
    - >-
      curl --fail --show-error --silent --location --max-redirs 3
      --proto '=https' --tlsv1.2
      "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
      --output /tmp/rustup-init
    - printf '%s  /tmp/rustup-init\n' "$RUSTUP_INIT_SHA256" | sha256sum -c -
    - chmod +x /tmp/rustup-init
    - /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-deb.sh
    - ./packaging-ci/scripts/write-build-info.sh deb
  # FORMAT is "deb" in both deb lanes; a distinct archive name keeps their
  # dist/build-info.json from overwriting each other.
  artifacts:
    name: "lightning-deb-ubuntu-${CI_PIPELINE_ID}"


build-rpm:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)rpm(,|$)/'
    - when: never
  extends: .build-base
  image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # fedora:44
  tags: [dnf, rpm, package]
  resource_group: lightning-package-build-b
  variables:
    FORMAT: "rpm"
    BASE_IMAGE: "fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80"
    RUST_TOOLCHAIN: "1.93.0"
    RUSTUP_VERSION: "1.29.1"
    # sha256 of static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
    RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
  before_script:
    - >-
      dnf install -y
      appstream ca-certificates ccache cmake curl desktop-file-utils
      gcc gcc-c++ git jq libsecret-devel
      ninja-build openssl-devel patchelf pkgconf-pkg-config
      qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel
      qt6-qtsvg-devel qt6-qttools-devel rpm-build sqlite-devel zstd
    # GStreamer development files for the call media engine; without them the
    # pkg-config probe fails and the build is rejected.
    - >-
      dnf install -y
      gstreamer1-devel gstreamer1-plugins-base-devel
      gstreamer1-plugins-bad-free-devel
    # Fedora's system rust OOMs compiling matrix-sdk under the 6 GiB runner cap;
    # use the same pinned rustup toolchain as the other Linux builds.
    - >-
      curl --fail --show-error --silent --location --max-redirs 3
      --proto '=https' --tlsv1.2
      "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
      --output /tmp/rustup-init
    - printf '%s  /tmp/rustup-init\n' "$RUSTUP_INIT_SHA256" | sha256sum -c -
    - chmod +x /tmp/rustup-init
    - /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-rpm.sh
    - ./packaging-ci/scripts/write-build-info.sh rpm

build-flatpak:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)flatpak(,|$)/'
    - when: never
  extends: .build-base
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [flatpak, package]
  resource_group: lightning-package-build-a
  variables:
    FORMAT: "flatpak"
    BASE_IMAGE: "debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    # elfutils: flatpak-builder uses eu-strip/eu-elfcompress for debuginfo.
    #
    # librsvg2-common is gdk-pixbuf's SVG loader module, which
    # `appstreamcli compose` needs to rasterise the scalable app icon.
    # --no-install-recommends leaves it out; without it compose fails with
    # `file-read-error` / `filters-but-no-output`. build-flatpak.sh checks for it.
    # xz-utils: flatpak-builder unpacks the gst-ximagesrc .tar.xz on the host.
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates curl elfutils flatpak flatpak-builder git jq
      librsvg2-common python3 xz-utils zstd
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-flatpak.sh

build-appimage:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .build-base
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [appimage, package]
  resource_group: lightning-package-build-b
  variables:
    FORMAT: "appimage"
    BASE_IMAGE: "debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
    DEBIAN_FRONTEND: "noninteractive"
    RUST_TOOLCHAIN: "1.93.0"
    RUSTUP_VERSION: "1.29.1"
    # sha256 of static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
    RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential ca-certificates ccache cmake curl file git jq
      libsecret-1-dev libsqlite3-dev libssl-dev ninja-build patchelf
      pkg-config qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-multimedia-dev qt6-svg-dev
      qt6-tools-dev qt6-wayland qml6-module-qtmultimedia
      qml6-module-qtquick qml6-module-qtquick-controls
      qml6-module-qtquick-dialogs qml6-module-qtquick-effects
      qml6-module-qtquick-layouts qml6-module-qtquick-window zstd
    # GStreamer development files for the call media engine; without them the
    # pkg-config probe fails and the build is rejected.
    - >-
      apt-get install -y --no-install-recommends
      libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      libgstreamer-plugins-bad1.0-dev
    # Runtime plugins the AppImage bundles (build-appimage.sh stages them before
    # linuxdeploy). The deb and rpm declare them as dependencies instead; the
    # snap inherits this AppDir.
    - >-
      apt-get install -y --no-install-recommends
      gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-pipewire
      gstreamer1.0-alsa gstreamer1.0-gl
    # NSS is listed explicitly: Debian's libsrtp2 uses NSS, which dlopens
    # libsoftokn3 and libfreebl3, so no ELF walk finds them. Without them SRTP
    # fails and calls carry no media (always so under snap confinement).
    # build-appimage.sh fails if they are absent.
    - >-
      apt-get install -y --no-install-recommends
      libnss3
      libspa-0.2-modules libpipewire-0.3-modules
    # The SPA and PipeWire module packages are not pulled in by
    # gstreamer1.0-pipewire; libpipewire dlopens them, and screen share fails
    # without them. build-appimage.sh stages the subset it needs.
    #
    # client.conf comes from pipewire-bin; unpacking it avoids a 55-package
    # install for one file.
    - >-
      ( cd /tmp && apt-get download pipewire-bin
      && dpkg-deb -x pipewire-bin_*.deb /opt/pipewire-conf )
    - test -f /opt/pipewire-conf/usr/share/pipewire/client.conf
    # Qt image-format plugins are dlopen'd, so linuxdeploy-plugin-qt deploys only
    # qtbase's own (gif, ico, jpeg); WebP and JPEG XL are staged explicitly.
    #
    #   qt6-image-formats-plugins : libqwebp.so
    #   libjxl0.11                : the JPEG XL runtime kimg_jxl.so links
    #
    # The only Qt JXL decoder is KDE's kimageformats. It is unpacked rather than
    # installed, which would pull libheif/OpenEXR/x265 and drop unshipped
    # kimg_avif/kimg_heif into the staging directory.
    - >-
      apt-get install -y --no-install-recommends
      qt6-image-formats-plugins libjxl0.11
    - >-
      ( cd /tmp && apt-get download kimageformat6-plugins
      && dpkg-deb -x kimageformat6-plugins_*.deb /opt/kimageformats )
    - >-
      test -f /opt/kimageformats/usr/lib/x86_64-linux-gnu/qt6/plugins/imageformats/kimg_jxl.so
    # The rustup installer is version-pinned and checksum-verified before it runs.
    - >-
      curl --fail --show-error --silent --location --max-redirs 3
      --proto '=https' --tlsv1.2
      "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
      --output /tmp/rustup-init
    - printf '%s  /tmp/rustup-init\n' "$RUSTUP_INIT_SHA256" | sha256sum -c -
    - chmod +x /tmp/rustup-init
    - /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
    - export PATH="/root/.cargo/bin:$PATH"
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-appimage.sh

build-snap:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)snap(,|$)/ && $BUILD_FORMATS =~ /(^|,)appimage(,|$)/'
    - when: never
  extends: .build-base
  image: ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517 # ubuntu:24.04
  tags: [snap, package]
  resource_group: lightning-package-build-a
  variables:
    FORMAT: "snap"
    BASE_IMAGE: "ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517"
    DEBIAN_FRONTEND: "noninteractive"
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-appimage
      artifacts: true
  before_script:
    - apt-get update
    # The graphics libraries are build inputs for the snap: build-snap.sh stages
    # whatever the binary cannot resolve against the AppDir (linuxdeploy's
    # excludelist leaves them to the host, which a confined snap cannot see).
    # This image matches the snap's base (core24), so they are
    # glibc-compatible with it.
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates file jq python3 python3-yaml squashfs-tools zstd
      libegl1 libglx0 libgl1 libopengl0
      libx11-6 libx11-xcb1 libxcb1 libxkbcommon-x11-0
      libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
      libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1
      libxcb-xfixes0 libxcb-xkb1 libxcb-cursor0 libxcb-util1
      libxcb-glx0 libxcb-present0 libxcb-dri3-0
    # binutils: build-snap.sh's payload guard walks each plugin's NEEDED graph
    # with `readelf`, which ubuntu:24.04 lacks; without it the guard passes
    # vacuously.
    #
    # `stage_unresolved_libs` copies what `ldd` resolves on this host, so every
    # library family build-snap.sh stages must be installed here:
    # libsm6/libice6/libuuid1 for Qt's xcb platform plugin, libasound2t64 for
    # libgstalsa, libwayland-* for the Wayland platform plugins,
    # libfribidi0/libthai0 for Qt Multimedia's ffmpeg backend. Some already
    # arrive as dependencies; they are listed so the payload's needs are explicit.
    - >-
      apt-get install -y --no-install-recommends
      binutils
      libsm6 libice6 libuuid1
      libasound2t64 libdrm2 libgbm1
      libwayland-cursor0 libwayland-egl1
      libfribidi0 libthai0
    # xkb and fontconfig data: core24 has neither, and without them the confined
    # snap segfaults when it places its window.
    - >-
      apt-get install -y --no-install-recommends
      xkb-data fontconfig-config
  script:
    - ./packaging-ci/scripts/build-snap.sh

windows-package-test:
  extends: .windows-test-rules
  stage: build
  image:
    name: lightning-windows-builder:fedora44-qt6.11.2-ffmpeg7.1.1-gst1.28.5-rust1.95.0-v7
    pull_policy: if-not-present
  tags: [windows-cross, windows-package]
  resource_group: lightning-windows-cross-package
  interruptible: true
  timeout: 2h
  needs:
    - job: resolve-source
      artifacts: true
  variables:
    CARGO_HOME: "/cache/cargo-windows"
    BUILD_JOBS: "4"
  before_script:
    - test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
    - test "$BUILD_WINDOWS_PACKAGES" = "true"
    - test "$PUBLISH_PACKAGES" = "false"
    - test "$BUILD_FORMATS" = "none"
    - test -z "$RELEASE_VERSION"
    - test -z "$RELEASE_NOTES_B64"
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-windows.sh
  artifacts:
    name: "lightning-windows-test-${CI_PIPELINE_ID}"
    when: always
    access: developer
    expire_in: 7 days
    # Installers and reports only: the staging tree is already inside the
    # portable zip, and archiving it again exceeds the 1 GiB artifact cap
    # (the job then succeeds with no archive stored).
    paths:
      - dist/windows/*-portable.zip
      - dist/windows/*.msi
      - dist/windows/*-setup.exe
      - dist/windows/reports/
      # Checksum only; the executable is already in the portable zip. A
      # SignPath-bound pipeline publishes the payload itself — see
      # docs/signpath-integration.md.
      - dist/windows/signing-payload/*.sha256

# Release Windows build: builds and validates the portable/MSI/setup artifacts
# (build-windows.sh calls validate-windows-artifacts.sh) from the resolved
# commit, with GIF keys required. The builder image carries FFmpeg so inline
# video uses ffmpegmediaplugin rather than the WMF backend.
build-windows:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_PACKAGES == "true"'
      when: on_success
    - when: never
  stage: build
  image:
    name: lightning-windows-builder:fedora44-qt6.11.2-ffmpeg7.1.1-gst1.28.5-rust1.95.0-v7
    pull_policy: if-not-present
  tags: [windows-cross, windows-package]
  resource_group: lightning-windows-cross-package
  interruptible: true
  timeout: 2h
  needs:
    - job: resolve-source
      artifacts: true
  variables:
    CARGO_HOME: "/cache/cargo-windows"
    BUILD_JOBS: "4"
  before_script:
    - test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
    - test "$PUBLISH_PACKAGES" = "true"
  script:
    - ./packaging-ci/scripts/prepare-pinned-source.sh
    - ./packaging-ci/scripts/build-windows.sh
  artifacts:
    name: "lightning-windows-${CI_PIPELINE_ID}"
    when: always
    expire_in: 7 days
    paths:
      - dist/windows/

# Native macOS arm64 bundle, built on the Mac mini runner (10.195.35.7) with
# the shell executor against a host-installed toolchain; build-macos.sh records
# the toolchain versions in build-info.json since no image pins them.
#
# Published as a download-only asset (ad-hoc signed, un-notarized; Apple
# Silicon, macOS 26+). It is not in the signed update manifest: the client has
# no macOS install strategy.
macos-package-test:
  extends: .macos-test-rules
  stage: build
  tags: [macos, arm64]
  resource_group: lightning-macos-package
  interruptible: true
  # Non-blocking: an unavailable Mac must not hold back the Linux and Windows
  # packages. allow_failure covers a failed job and the optional `needs` in
  # publish-packages covers an absent one; write-manifest.sh then publishes
  # without a macOS entry.
  allow_failure: true
  # Headroom, not an estimate.
  timeout: 3h
  needs:
    - job: resolve-source
      artifacts: true
  variables:
    # The dominant step is the single-threaded fat-LTO link, which BUILD_JOBS
    # does not affect.
    BUILD_JOBS: "4"
  before_script:
    - test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
    - test "$BUILD_MACOS_PACKAGES" = "true"
  script:
    # caffeinate: macOS idle sleep ignores CPU load and gitlab-runner takes no
    # power assertion, so a headless Mac otherwise sleeps mid-build. This holds
    # regardless of the host's pmset settings.
    - caffeinate -dims ./packaging-ci/scripts/prepare-pinned-source-macos.sh
    - caffeinate -dims ./packaging-ci/scripts/build-macos.sh
  artifacts:
    name: "lightning-macos-test-${CI_PIPELINE_ID}"
    when: always
    access: developer
    expire_in: 7 days
    paths:
      - dist/macos/*.zip
      - dist/macos/*.sha256
      - dist/macos/build-info.json
      - dist/macos/reports/

validate-deb:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)deb(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: debian@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 # debian:13.6-slim
  tags: [apt, deb, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-deb
      artifacts: true
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      appstream binutils ca-certificates desktop-file-utils file lintian
      procps shared-mime-info
  script: [./packaging-ci/scripts/validate-deb.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.deb
      - dist/*.sha256
      - dist/*deb*.log
      - dist/*deb*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json

# The Ubuntu lane's validator: same script, different target.
#
# Like every validator here it runs on the same image that built the package,
# so it cannot catch a package that installs only where it was built. Covering
# that needs a cross-image install job per format.
validate-deb-ubuntu:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
    - if: '$BUILD_FORMATS == "all"'
    - if: '$BUILD_FORMATS =~ /(^|,)deb(,|$)/'
    - when: never
  extends: .trusted-pipeline
  stage: validate
  image: ubuntu@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d # ubuntu:26.04
  variables:
    DEB_SUFFIX: "ubuntu2604"
  tags: [apt, deb, package]
  needs:
    - job: resolve-source
      artifacts: true
    - job: build-deb-ubuntu
      artifacts: true
  before_script:
    - test ! -e work/lightning
    - command -v nix >/dev/null 2>&1 && exit 1 || true
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      appstream binutils ca-certificates desktop-file-utils file lintian
      procps shared-mime-info
  script: [./packaging-ci/scripts/validate-deb.sh]
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.deb
      - dist/*.sha256
      - dist/*deb*.log
      - dist/*deb*.txt
      - dist/source-info.json
      - dist/version.env
      - dist/version.json


validate-rpm:
  # Build-only pipelines may select formats via BUILD_FORMATS;
  # publishing pipelines always include every format.
  rules:
    - if: '$PUBLISH_PACKAGES == "true"'
