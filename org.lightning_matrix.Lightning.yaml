app-id: org.lightning_matrix.Lightning
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: lightning-matrix

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.mpris.MediaPlayer2.spotify
  - --own-name=org.mpris.MediaPlayer2.lightning
  - --own-name=org.mpris.MediaPlayer2.lightning.*
  - --filesystem=xdg-run/pipewire-0

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lightning/cargo
    CARGO_NET_OFFLINE: "true"

modules:
  - name: gst-ximagesrc
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Dximagesrc=enabled
      - -Dximagesrc-xshm=enabled
      - -Dximagesrc-xfixes=enabled
      - -Dximagesrc-xdamage=enabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.26.11.tar.xz
        sha256: 001deb0876d5d743cd3448abf74a27adec3fd850012fcb1b00994861bd6c1145
    post-install:
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/COPYING /app/share/licenses/${FLATPAK_ID}/gst-ximagesrc/COPYING
    cleanup:
      - /include
      - /lib/pkgconfig

  # Spell-check dictionaries, read from /app/share/hunspell
  # (src/text/SpellBackend.cpp). The KDE runtime has libhunspell but no
  # enchant, so without this module the Flatpak checks nothing beyond what the
  # runtime happens to carry. English plus every UI language with a free
  # Hunspell dictionary (Chinese has none), from LibreOffice's dictionaries at
  # the commit tagged libreoffice-25.2.3.1 -- the same files the Nix package
  # uses. The AppImage and Snap bundle Debian 13's hunspell-* packages
  # instead; for en_US, de, fr and ar those come from other upstreams, so the
  # word lists differ slightly between formats. Each language's licence ships
  # beside it.
  - name: hunspell-dictionaries
    buildsystem: simple
    build-commands:
      - install -Dm644 en/en_US.aff /app/share/hunspell/en_US.aff
      - install -Dm644 en/en_US.dic /app/share/hunspell/en_US.dic
      - install -Dm644 en/en_GB.aff /app/share/hunspell/en_GB.aff
      - install -Dm644 en/en_GB.dic /app/share/hunspell/en_GB.dic
      - install -Dm644 ar/ar.aff /app/share/hunspell/ar.aff
      - install -Dm644 ar/ar.dic /app/share/hunspell/ar.dic
      - install -Dm644 bn_BD/bn_BD.aff /app/share/hunspell/bn_BD.aff
      - install -Dm644 bn_BD/bn_BD.dic /app/share/hunspell/bn_BD.dic
      - install -Dm644 de/de_DE_frami.aff /app/share/hunspell/de_DE.aff
      - install -Dm644 de/de_DE_frami.dic /app/share/hunspell/de_DE.dic
      - install -Dm644 es/es_ES.aff /app/share/hunspell/es_ES.aff
      - install -Dm644 es/es_ES.dic /app/share/hunspell/es_ES.dic
      - install -Dm644 fr_FR/fr.aff /app/share/hunspell/fr.aff
      - install -Dm644 fr_FR/fr.dic /app/share/hunspell/fr.dic
      - install -Dm644 hi_IN/hi_IN.aff /app/share/hunspell/hi_IN.aff
      - install -Dm644 hi_IN/hi_IN.dic /app/share/hunspell/hi_IN.dic
      - install -Dm644 id/id_ID.aff /app/share/hunspell/id_ID.aff
      - install -Dm644 id/id_ID.dic /app/share/hunspell/id_ID.dic
      - install -Dm644 lt_LT/lt.aff /app/share/hunspell/lt_LT.aff
      - install -Dm644 lt_LT/lt.dic /app/share/hunspell/lt_LT.dic
      - install -Dm644 pt_PT/pt_PT.aff /app/share/hunspell/pt_PT.aff
      - install -Dm644 pt_PT/pt_PT.dic /app/share/hunspell/pt_PT.dic
      - install -Dm644 pt_BR/pt_BR.aff /app/share/hunspell/pt_BR.aff
      - install -Dm644 pt_BR/pt_BR.dic /app/share/hunspell/pt_BR.dic
      - install -Dm644 ru_RU/ru_RU.aff /app/share/hunspell/ru_RU.aff
      - install -Dm644 ru_RU/ru_RU.dic /app/share/hunspell/ru_RU.dic
      - install -Dm644 en/license.txt /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/en/license.txt
      - install -Dm644 en/README_en_US.txt /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/en/README_en_US.txt
      - install -Dm644 en/README_en_GB.txt /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/en/README_en_GB.txt
      - install -Dm644 ar/COPYING.txt /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/ar/COPYING.txt
      - install -Dm644 bn_BD/COPYING /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/bn_BD/COPYING
      - install -Dm644 de/COPYING_GPLv2 /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/de/COPYING_GPLv2
      - install -Dm644 de/COPYING_GPLv3 /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/de/COPYING_GPLv3
      - install -Dm644 de/README_de_DE_frami.txt /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/de/README_de_DE_frami.txt
      - install -Dm644 es/LICENSE.md /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/es/LICENSE.md
      - install -Dm644 fr_FR/README_fr.txt /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/fr_FR/README_fr.txt
      - install -Dm644 hi_IN/COPYING /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/hi_IN/COPYING
      - install -Dm644 id/LICENSE-dict /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/id/LICENSE-dict
      - install -Dm644 lt_LT/COPYING /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/lt_LT/COPYING
      - install -Dm644 pt_BR/README_pt_BR.txt /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/pt_BR/README_pt_BR.txt
      - install -Dm644 pt_PT/LICENSES.txt /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/pt_PT/LICENSES.txt
      - install -Dm644 ru_RU/README_ru_RU.txt /app/share/licenses/${FLATPAK_ID}/hunspell-dictionaries/ru_RU/README_ru_RU.txt
