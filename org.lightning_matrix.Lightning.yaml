app-id: org.lightning_matrix.Lightning
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: lightning-matrix

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/pipewire-0

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lightning/cargo
    CARGO_NET_OFFLINE: "true"

modules:
  - name: gst-ximagesrc
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Dximagesrc=enabled
      - -Dximagesrc-xshm=enabled
      - -Dximagesrc-xfixes=enabled
      - -Dximagesrc-xdamage=enabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.26.11.tar.xz
        sha256: 001deb0876d5d743cd3448abf74a27adec3fd850012fcb1b00994861bd6c1145
    post-install:
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/COPYING /app/share/licenses/${FLATPAK_ID}/gst-ximagesrc/COPYING
    cleanup:
      - /include
      - /lib/pkgconfig

  - name: lightning
    buildsystem: cmake-ninja
    build-options:
      env:
        LIGHTNING_BUILD_GIPHY_API_KEY: "cAOuVhjN4BI5vtH3iYuWpgKewsME80MF"
        LIGHTNING_BUILD_KLIPY_API_KEY: "sYbUpgwUKt4tAZj8LFPoUPEDVzJxYtqO2PA4LcF1kO7pFYELZD60OvdkcxstuPxa"
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DENABLE_RUST_SDK_BACKEND=ON
      - -DLIGHTNING_RUST_ONLY=ON
      - -DLIGHTNING_INSTALL_TYPE=linux-flatpak
      - -DLIGHTNING_ARTIFACT_KIND=release
      - -DLIGHTNING_ENABLE_WEBRTC=ON
      - -DLIGHTNING_REQUIRE_WEBRTC=ON
      - -DLIGHTNING_REQUIRE_QT_SVG=ON
      - -DLIGHTNING_REQUIRE_GIF_KEYS=ON
      - -DLIGHTNING_UPDATE_PUBKEY_2026A=pnNX0yQfhr66fpbMJ89MCNWkHVtfAr+WwI9c4OHzz50=
    sources:
      - type: git
        url: https://github.com/Mizerd/lightning.git
        tag: v0.10.0
        commit: 1e80899775b70c0c631c05fb5b16af18099863a7
        x-checker-data:
          type: git
          tag-pattern: '^v([\d.]+)$'
      - cargo-sources.json
