app-id: org.lightning_matrix.Lightning
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: lightning-matrix

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/pipewire-0

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lightning/cargo
    CARGO_NET_OFFLINE: "true"

modules:
  # The KDE runtime's GStreamer has no ximagesrc, the only way to share an X11
  # screen when no portal offers ScreenCast. Only that plugin is built, from
  # the runtime's GStreamer series; /app/lib/gstreamer-1.0 is on the runtime's
  # plugin path.
  - name: gst-ximagesrc
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Dximagesrc=enabled
      - -Dximagesrc-xshm=enabled
      - -Dximagesrc-xfixes=enabled
      - -Dximagesrc-xdamage=enabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.26.11.tar.xz
        sha256: 001deb0876d5d743cd3448abf74a27adec3fd850012fcb1b00994861bd6c1145
    # Not /share: flatpak-builder installs the module's LGPL licence text to
    # /app/share/licenses, and it must ship with the binary.
    cleanup:
      - /include
      - /lib/pkgconfig

  - name: lightning
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DENABLE_RUST_SDK_BACKEND=ON
      - -DLIGHTNING_RUST_ONLY=ON
      - -DLIGHTNING_INSTALL_TYPE=linux-flatpak
      - -DLIGHTNING_ARTIFACT_KIND=release
      - -DLIGHTNING_ENABLE_WEBRTC=ON
      - -DLIGHTNING_REQUIRE_WEBRTC=ON
      - -DLIGHTNING_REQUIRE_QT_SVG=ON
      - -DLIGHTNING_REQUIRE_GIF_KEYS=OFF
      - -DLIGHTNING_UPDATE_PUBKEY_2026A=pnNX0yQfhr66fpbMJ89MCNWkHVtfAr+WwI9c4OHzz50=
    sources:
      - type: git
        url: https://github.com/Mizerd/lightning.git
        tag: v0.9.9
        commit: 54d1bdb18656c0bff622049310c8e47621873fa5
        x-checker-data:
          type: git
          tag-pattern: '^v([\d.]+)$'
      - cargo-sources.json
